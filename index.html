<style>
:root{--ink:#eef8f4;--soft:rgba(238,248,244,.72);--dim:rgba(238,248,244,.5);--glow:#9fef00;--cyan:#5ff5d2;--bg:#06161a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(26px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tag{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}

.fed b{color:var(--cyan)}
.hero{max-width:720px}
h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(46px,9vw,104px);line-height:.92;letter-spacing:-1px;color:var(--ink);text-shadow:0 2px 30px rgba(0,0,0,.55)}
h1 em{font-style:italic;color:#ffd9c7}
.sub{margin-top:12px;font-size:clamp(11px,1.6vw,13px);letter-spacing:2px;color:var(--soft);text-transform:lowercase}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;pointer-events:auto}
.links a{font-size:13px;color:var(--ink);text-decoration:none;padding:10px 16px;border-radius:999px;border:1px solid rgba(238,248,244,.25);background:rgba(6,22,26,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .2s,background .2s,transform .2s}
.links a:hover,.links a:focus-visible{border-color:var(--glow);background:rgba(159,239,0,.12);transform:translateY(-2px);outline:none}
.links a.go{background:var(--glow);color:#06161a;border-color:var(--glow);font-weight:600}
.links a.go:hover,.links a.go:focus-visible{background:#b8ff3a}
.hint{margin-top:16px;font-size:11px;color:var(--dim);letter-spacing:1px}
.hint kbd{font-family:inherit;color:var(--cyan)}
@media (max-width:560px){.links a{padding:9px 13px;font-size:12px}.fed{display:none}}
@media (prefers-reduced-motion:reduce){.links a{transition:none}}

<body>
<canvas id="pond" aria-hidden="true"></canvas>
<div class="ui">
  <div class="top">
    <div class="tag">◈ CompTIA <b>Security+</b> SY0-701</div>
    <div class="fed" id="fed" aria-live="polite"></div>
  </div>
  <main class="hero">
    <h1>Security+<br><em>Bootcamp</em></h1>
    <p class="sub">welcome to the pond · a calm place to practice for the exam</p>
    <nav class="links" aria-label="Bootcamp sections">
      <a class="go" href="ctf.html">Enter the CTF →</a>
      <a href="ctf.html#labs">Command-line labs</a>
      <a href="ctf.html#challenges">PBQs</a>
      <a href="ctf.html#reference">Ports &amp; acronyms</a>
      <a href="ctf.html#arsenal">Arsenal</a>
      <a href="https://github.com/Alexander-Maldonado-Pelayo/Security-Bootcamp" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </nav>
    <p class="hint" id="hint">tap the water to drop data packets for the koi</p>
  </main>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('pond'), ctx = cv.getContext('2d');
const fedEl = document.getElementById('fed');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1, floor = null, t = 0, fed = 0, vignette = null;
const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
const pointer = {x: -999, y: -999, active: false, last: 0};
function sprite(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const PULSE = sprite(32, [[0, 'rgba(95,245,210,.6)'], [1, 'rgba(95,245,210,0)']]);
const FOODGLOW = sprite(32, [[0, 'rgba(159,239,0,.7)'], [1, 'rgba(159,239,0,0)']]);
const LIGHT = sprite(256, [[0, 'rgba(120,220,200,.06)'], [1, 'rgba(120,220,200,0)']]);

// ───────── pond floor: dark water, soft light, circuit traces ─────────
let traces = [];
function buildFloor() {
  floor = document.createElement('canvas');
  floor.width = W * DPR; floor.height = H * DPR;
  const f = floor.getContext('2d'); f.scale(DPR, DPR);
  const g = f.createRadialGradient(W * .62, H * .35, 10, W * .5, H * .5, Math.max(W, H) * .8);
  g.addColorStop(0, '#12403f'); g.addColorStop(.55, '#0a2a2d'); g.addColorStop(1, '#051418');
  f.fillStyle = g; f.fillRect(0, 0, W, H);
  // stones
  for (let i = 0; i < Math.round(W * H / 26000); i++) {
    const x = rand(0, W), y = rand(0, H), r = rand(10, 46);
    const s = f.createRadialGradient(x - r * .3, y - r * .3, 1, x, y, r);
    s.addColorStop(0, 'rgba(70,110,104,.22)'); s.addColorStop(1, 'rgba(10,30,32,0)');
    f.fillStyle = s; f.beginPath(); f.ellipse(x, y, r, r * rand(.6, .9), rand(0, TAU), 0, TAU); f.fill();
  }
  // circuit traces (Manhattan paths with via pads)
  traces = [];
  const step = 28, n = Math.round(W * H / 52000) + 6;
  f.lineCap = 'round'; f.lineJoin = 'round';
  for (let k = 0; k < n; k++) {
    let x = Math.round(rand(0, W) / step) * step, y = Math.round(rand(0, H) / step) * step;
    const pts = [[x, y]]; let dir = Math.floor(rand(0, 4));
    for (let s = 0; s < rand(4, 11); s++) {
      if (Math.random() < .35) dir = (dir + (Math.random() < .5 ? 1 : 3)) % 4;
      const len = step * Math.floor(rand(1, 5));
      x += [len, 0, -len, 0][dir]; y += [0, len, 0, -len][dir];
      pts.push([x, y]);
    }
    f.strokeStyle = 'rgba(95,245,210,.07)'; f.lineWidth = 1.4;
    f.beginPath(); pts.forEach(([a, b], i) => (i ? f.lineTo(a, b) : f.moveTo(a, b))); f.stroke();
    for (const [a, b] of [pts[0], pts[pts.length - 1]]) { f.strokeStyle = 'rgba(95,245,210,.12)'; f.beginPath(); f.arc(a, b, 3.2, 0, TAU); f.stroke(); }
    let total = 0; const seg = [];
    for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
    traces.push({pts, seg, total, off: rand(0, total), speed: rand(30, 70)});
  }
}
function tracePoint(tr, d) {
  d %= tr.total;
  for (let i = 0; i < tr.seg.length; i++) {
    if (d <= tr.seg[i]) { const a = tr.pts[i], b = tr.pts[i + 1], k = d / tr.seg[i]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
    d -= tr.seg[i];
  }
  return tr.pts[tr.pts.length - 1];
}

// ───────── koi ─────────
const PALETTES = [
  {base: '#f6f1ea', spots: ['#ff6a3d', '#ff8a5b']},            // kohaku
  {base: '#f6f1ea', spots: ['#ff6a3d', '#1b1b1f']},            // taisho sanke
  {base: '#ff8a3d', spots: ['#ffb27a']},                        // orange ogon-ish
  {base: '#f8f4ec', spots: ['#1b1b1f']},                        // shiro utsuri
  {base: '#ffd36b', spots: ['#ffefb8']},                        // yamabuki
  {base: '#e9eef0', spots: ['#ff5a36', '#20262b']},             // showa
];
const SEGS = 16;
class Koi {
  constructor(i) {
    this.len = rand(70, 118) * Math.min(1, Math.max(.7, Math.min(W, H) / 700));
    this.gap = this.len / SEGS;
    this.x = rand(80, W - 80); this.y = rand(80, H - 80);
    this.a = rand(0, TAU); this.sp = rand(.7, 1.15); this.base = this.sp;
    this.wander = rand(0, TAU); this.flap = rand(0, TAU);
    this.pal = PALETTES[i % PALETTES.length];
    this.spine = Array.from({length: SEGS}, (_, k) => ({x: this.x - Math.cos(this.a) * k * this.gap, y: this.y - Math.sin(this.a) * k * this.gap}));
    this.spots = Array.from({length: Math.round(rand(2, 5))}, () => ({t: rand(.12, .78), s: rand(-.6, .6), r: rand(.18, .42), c: this.pal.spots[Math.floor(rand(0, this.pal.spots.length))]}));
  }
  width(k) { const u = k / (SEGS - 1); return this.len * .15 * (u < .28 ? .62 + u / .28 * .38 : Math.max(.08, 1 - (u - .28) / .72 * .92)); }
  steer(target, w) { let d = Math.atan2(target[1] - this.y, target[0] - this.x) - this.a; d = Math.atan2(Math.sin(d), Math.cos(d)); this.a += Math.max(-w, Math.min(w, d)); }
  update(dt) {
    this.wander += rand(-.08, .08);
    let want = this.base, turn = .02;
    // wander
    this.steer([this.x + Math.cos(this.a + this.wander * .2) * 50, this.y + Math.sin(this.a + this.wander * .2) * 50], .012);
    // food
    let best = null, bd = 320;
    for (const p of food) { const d = Math.hypot(p.x - this.x, p.y - this.y); if (d < bd) { bd = d; best = p; } }
    if (best) { this.steer([best.x, best.y], .06); want = 1.7; if (bd < 12) { best.eaten = true; fed++; ripple(best.x, best.y, 20, .45); updateFed(); } }
    // flee the pointer
    const pd = Math.hypot(pointer.x - this.x, pointer.y - this.y);
    if (pointer.active && pd < 150) { this.steer([this.x - (pointer.x - this.x), this.y - (pointer.y - this.y)], .12); want = 3.4; turn = .1; }
    // walls
    const m = 70;
    if (this.x < m || this.x > W - m || this.y < m || this.y > H - m) this.steer([W / 2, H / 2], .05);
    this.sp += (want - this.sp) * (want > this.sp ? .08 : .02);
    this.flap += .12 + this.sp * .09;
    const v = this.sp * dt * 60;
    this.x += Math.cos(this.a) * v; this.y += Math.sin(this.a) * v;
    const s = this.spine; s[0].x = this.x; s[0].y = this.y;
    for (let k = 1; k < SEGS; k++) {
      const wig = Math.sin(this.flap - k * .45) * .9 * (k / SEGS);
      const dx = s[k].x - s[k - 1].x, dy = s[k].y - s[k - 1].y, d = Math.hypot(dx, dy) || 1;
      s[k].x = s[k - 1].x + dx / d * this.gap + Math.cos(this.a + Math.PI / 2) * wig * .3;
      s[k].y = s[k - 1].y + dy / d * this.gap + Math.sin(this.a + Math.PI / 2) * wig * .3;
    }
    void turn;
  }
  outline() {
    const s = this.spine, L = [], R = [];
    for (let k = 0; k < SEGS; k++) {
      const p = s[k], q = s[Math.min(k + 1, SEGS - 1)], o = s[Math.max(k - 1, 0)];
      const ang = Math.atan2(o.y - q.y, o.x - q.x) + Math.PI / 2, w = this.width(k);
      L.push([p.x + Math.cos(ang) * w, p.y + Math.sin(ang) * w]); R.push([p.x - Math.cos(ang) * w, p.y - Math.sin(ang) * w]);
    }
    const path = new Path2D();
    const head = s[0], ha = Math.atan2(s[0].y - s[1].y, s[0].x - s[1].x), hw = this.width(0);
    path.moveTo(L[0][0], L[0][1]);
    for (let k = 1; k < SEGS; k++) path.lineTo(L[k][0], L[k][1]);
    for (let k = SEGS - 1; k >= 0; k--) path.lineTo(R[k][0], R[k][1]);
    path.quadraticCurveTo(head.x + Math.cos(ha) * hw * 1.6, head.y + Math.sin(ha) * hw * 1.6, L[0][0], L[0][1]);
    return path;
  }
  draw() {
    const s = this.spine, body = this.outline();
    const ang = k => Math.atan2(s[k].y - s[k + 1].y, s[k].x - s[k + 1].x);
    // shadow on the pond floor
    ctx.save(); ctx.translate(8, 11); ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fill(body); ctx.translate(3, 3); ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fill(body); ctx.restore();
    // pectoral fins
    const fa = ang(3), fw = this.width(3), flap = Math.sin(this.flap * .7) * .35;
    ctx.fillStyle = 'rgba(246,241,234,.55)';
    for (const side of [1, -1]) {
      ctx.save(); ctx.translate(s[3].x + Math.cos(fa + side * Math.PI / 2) * fw * .8, s[3].y + Math.sin(fa + side * Math.PI / 2) * fw * .8);
      ctx.rotate(fa + side * (2.2 + flap)); ctx.beginPath(); ctx.ellipse(fw * .9, 0, fw * 1.05, fw * .42, 0, 0, TAU); ctx.fill(); ctx.restore();
    }
    // tail
    const tk = SEGS - 1, ta = ang(tk - 1), tw = this.len * .17, swing = Math.sin(this.flap - 6) * .5;
    ctx.save(); ctx.translate(s[tk].x, s[tk].y); ctx.rotate(ta + Math.PI + swing * .4);
    ctx.fillStyle = 'rgba(246,241,234,.62)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(tw * .6, -tw * .7, tw * 1.1, -tw * .55); ctx.quadraticCurveTo(tw * .7, 0, tw * 1.1, tw * .55); ctx.quadraticCurveTo(tw * .6, tw * .7, 0, 0); ctx.fill();
    ctx.restore();
    // body + patches
    ctx.fillStyle = this.pal.base; ctx.fill(body);
    ctx.save(); ctx.clip(body);
    for (const sp of this.spots) {
      const k = Math.round(sp.t * (SEGS - 1)), p = s[k], a = ang(Math.min(k, SEGS - 2)), w = this.width(k);
      ctx.fillStyle = sp.c; ctx.beginPath();
      ctx.ellipse(p.x + Math.cos(a + Math.PI / 2) * w * sp.s, p.y + Math.sin(a + Math.PI / 2) * w * sp.s, this.len * sp.r * .5, w * 1.1, a, 0, TAU); ctx.fill();
    }
    // top-light sheen
    const hl = ctx.createLinearGradient(s[0].x, s[0].y - 30, s[0].x, s[0].y + 30);
    hl.addColorStop(0, 'rgba(255,255,255,.18)'); hl.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = hl; ctx.fill(body);
    ctx.restore();
    // eyes
    const ha = ang(0), ew = this.width(1) * .7;
    ctx.fillStyle = '#121417';
    for (const side of [1, -1]) { ctx.beginPath(); ctx.arc(s[1].x + Math.cos(ha + side * Math.PI / 2) * ew, s[1].y + Math.sin(ha + side * Math.PI / 2) * ew, 1.6, 0, TAU); ctx.fill(); }
  }
}

// ───────── lily pads, petals, ripples, food ─────────
let pads = [], petals = [], ripples = [], food = [], fish = [];
function makePads() {
  pads = Array.from({length: Math.max(4, Math.round(W * H / 140000))}, () => ({
    x: rand(0, W), y: rand(0, H), r: rand(22, 46) * Math.min(1, W / 700 + .35), a: rand(0, TAU), notch: rand(.25, .45),
    vx: 0, vy: 0, bob: rand(0, TAU), flower: Math.random() < .45,
  }));
}
function drawPad(p) {
  const r = p.r * (1 + Math.sin(t * .8 + p.bob) * .015);
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a + Math.sin(t * .3 + p.bob) * .05);
  ctx.save(); ctx.translate(6, 8); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, p.notch, TAU - .05); ctx.closePath(); ctx.fill(); ctx.restore();
  if (!p.grad) { p.grad = ctx.createRadialGradient(-p.r * .3, -p.r * .3, 2, 0, 0, p.r); p.grad.addColorStop(0, '#5fae5a'); p.grad.addColorStop(1, '#2f6e3b'); }
  ctx.fillStyle = p.grad; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, p.notch, TAU - .05); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(20,60,30,.35)'; ctx.lineWidth = 1;
  for (let i = 1; i < 7; i++) { const a = p.notch + (TAU - p.notch) * i / 7; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * .92, Math.sin(a) * r * .92); ctx.stroke(); }
  if (p.flower) {
    for (let ring = 0; ring < 2; ring++) for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU + ring * .4, pl = r * (ring ? .38 : .55);
      ctx.save(); ctx.rotate(a); ctx.fillStyle = ring ? '#ffd6e4' : '#f7a8c4';
      ctx.beginPath(); ctx.ellipse(pl * .5, 0, pl * .55, pl * .22, 0, 0, TAU); ctx.fill(); ctx.restore();
    }
    ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(0, 0, r * .1, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function ripple(x, y, max = 90, a = .55) {
  ripples.push({x, y, r: 2, max, a});
  for (const p of pads) {
    const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
    if (d < 220) { p.vx += dx / d * (220 - d) * .004; p.vy += dy / d * (220 - d) * .004; }
  }
}
function makePetals() { petals = Array.from({length: Math.round(W / 70) + 6}, () => newPetal(true)); }
function newPetal(any) { return {x: rand(-40, W), y: any ? rand(0, H) : -20, r: rand(2.5, 5), a: rand(0, TAU), vr: rand(-.02, .02), vx: rand(.15, .45), vy: rand(.2, .5), sway: rand(0, TAU)}; }
function drop(x, y) {
  ripple(x, y, 110, .6);
  for (let i = 0; i < 5; i++) food.push({x: x + rand(-24, 24), y: y + rand(-24, 24), born: t, eaten: false});
}
function updateFed() {
  fedEl.innerHTML = fed ? `packets delivered: <b>${fed}</b>` : '';
  if (fed === 1) document.getElementById('hint').textContent = 'they love packets. move your finger near them to scatter the school';
}

// ───────── loop ─────────
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildFloor(); makePads(); makePetals();
  vignette = ctx.createLinearGradient(0, H * .45, 0, H); vignette.addColorStop(0, 'rgba(4,14,17,0)'); vignette.addColorStop(1, 'rgba(4,14,17,.55)');
  const n = Math.max(5, Math.min(11, Math.round(W * H / 110000)));
  fish = Array.from({length: n}, (_, i) => new Koi(i));
}
let last = performance.now(), raf = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  ctx.drawImage(floor, 0, 0, W, H);
  // moving light on the water
  for (let i = 0; i < 3; i++) {
    const x = W * (.5 + .35 * Math.sin(t * .07 + i * 2.1)), y = H * (.5 + .35 * Math.cos(t * .05 + i * 1.7)), r = Math.max(W, H) * .35;
    ctx.drawImage(LIGHT, x - r, y - r, r * 2, r * 2);
  }
  // data pulses running through the circuit traces
  for (const tr of traces) {
    const [x, y] = tracePoint(tr, tr.off + t * tr.speed);
    ctx.drawImage(PULSE, x - 10, y - 10, 20, 20);
  }
  // food (glowing packets sinking and fading)
  food = food.filter(p => !p.eaten && t - p.born < 14);
  for (const p of food) {
    const age = t - p.born, al = Math.max(0, 1 - age / 14), s = 3.2;
    p.x += Math.sin(t * 1.3 + p.born) * .08;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(t * .8 + p.born);
    ctx.globalAlpha = al; ctx.drawImage(FOODGLOW, -12, -12, 24, 24);
    ctx.fillStyle = '#c8ff6a'; ctx.fillRect(-s, -s, s * 2, s * 2); ctx.restore();
  }
  // koi
  for (const f of fish) { f.update(dt); f.draw(); }
  // ripples
  ripples = ripples.filter(r => r.r < r.max);
  for (const r of ripples) {
    r.r += dt * 70; const k = 1 - r.r / r.max;
    ctx.strokeStyle = `rgba(220,255,245,${r.a * k})`; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    if (r.r > 14) { ctx.strokeStyle = `rgba(220,255,245,${r.a * k * .5})`; ctx.beginPath(); ctx.arc(r.x, r.y, r.r - 12, 0, TAU); ctx.stroke(); }
  }
  // lily pads drift, get pushed by ripples, wrap around
  for (const p of pads) {
    p.x += p.vx + Math.sin(t * .2 + p.bob) * .05; p.y += p.vy + Math.cos(t * .17 + p.bob) * .05;
    p.vx *= .97; p.vy *= .97; p.a += p.vx * .004;
    if (p.x < -60) p.x = W + 50; if (p.x > W + 60) p.x = -50; if (p.y < -60) p.y = H + 50; if (p.y > H + 60) p.y = -50;
    drawPad(p);
  }
  // petals
  for (const p of petals) {
    p.x += p.vx + Math.sin(t + p.sway) * .2; p.y += p.vy; p.a += p.vr;
    if (p.y > H + 10 || p.x > W + 10) Object.assign(p, newPetal(false));
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = 'rgba(255,214,228,.85)';
    ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  // a gentle vignette so the text stays readable
  ctx.fillStyle = vignette; ctx.fillRect(0, H * .45, W, H * .55);
  if (pointer.active && now - pointer.last > 2500) pointer.active = false;
  raf = requestAnimationFrame(frame);
}

// ───────── input ─────────
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointermove', e => {
  const [x, y] = pos(e);
  if (pointer.active && Math.hypot(x - pointer.x, y - pointer.y) > 40 && Math.random() < .25) ripple(x, y, 40, .25);
  Object.assign(pointer, {x, y, active: true, last: performance.now()});
});
cv.addEventListener('pointerdown', e => { const [x, y] = pos(e); Object.assign(pointer, {x, y, active: true, last: performance.now()}); drop(x, y); });
cv.addEventListener('pointerleave', () => { pointer.active = false; });
document.addEventListener('keydown', e => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); drop(rand(W * .2, W * .8), rand(H * .2, H * .6)); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else { last = performance.now(); raf = requestAnimationFrame(frame); } });
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });

resize();
if (reduce) {            // one still frame, no constant motion
  frame(performance.now()); cancelAnimationFrame(raf);
  document.getElementById('hint').textContent = 'motion is reduced on this device';
} else raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
