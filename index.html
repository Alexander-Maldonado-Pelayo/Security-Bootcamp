<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEC+ 701 CTF</title>
<meta name="description" content="A capture-the-flag game for the CompTIA Security+ SY0-701 exam: five machines, hands-on challenges, command-line labs and a boss-fight mock exam.">
<meta name="theme-color" content="#0b121f">
<meta property="og:title" content="SEC+ 701 CTF">
<meta property="og:description" content="Own five machines, solve command-line labs and beat the boss exam. A free Security+ SY0-701 study game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b121f'/%3E%3Cpath d='M20 12v40' stroke='%239fef00' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M22 14h24l-7 9 7 9H22z' fill='%239fef00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0b121f;--surface:rgba(20,29,43,.9);--surface2:rgba(26,35,50,.92);--solid:#111927;
  --border:#243044;--border2:#34445e;
  --accent:#9fef00;--accent2:#ff6b35;--accent3:#7cfc00;--accent4:#ffd700;--accent5:#c77dff;
  --text:#a4b1cd;--dim:#7b8aa5;--bright:#e8f4ff;--ok:#00c853;--bad:#ff3d57;--warn:#ffab00;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sans:'Syne',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 700px at 80% -10%,rgba(159,239,0,.09),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(46,231,182,.07),transparent 60%),var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;line-height:1.5}
#net{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 16px 60px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.86em;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:3px;color:var(--accent4);word-break:break-word}
.boot{padding:120px 0;text-align:center;font-family:var(--mono);color:var(--dim)}
.boot.err{color:var(--bad)}

/* HUD */
.hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-weight:800;color:var(--bright);font-size:17px;letter-spacing:.5px;background:none;border:0;white-space:nowrap}
.brand b{color:var(--accent)}
.brand small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--dim);font-weight:400;text-align:left}
.hud-sp{flex:1}
.pill{font-family:var(--mono);font-size:11px;padding:6px 12px;border:1px solid var(--border2);border-radius:20px;background:var(--surface);white-space:nowrap}
.pill b{color:var(--bright)}
.pill.fire b{color:var(--accent2)}
.xpbox{min-width:190px;flex:0 1 260px}
.xptop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:4px;gap:8px}
.xptop b{color:var(--accent4)}
.bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#2ee7b6);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tag{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:3px;text-transform:uppercase}
h1{font-size:clamp(28px,5.4vw,50px);font-weight:800;color:var(--bright);line-height:1.04;margin:10px 0 12px}
h1 span{background:linear-gradient(90deg,var(--accent),#2ee7b6);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:20px;color:var(--bright);font-weight:800;margin:34px 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 small{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:400}

.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;padding:28px;margin-top:8px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;border-radius:16px;padding:1px;background:linear-gradient(135deg,rgba(159,239,0,.7),transparent 35%,transparent 65%,rgba(46,231,182,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero p{max-width:54ch;font-size:15px}
.callsign{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.callsign label{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.callsign input{background:var(--solid);border:1px solid var(--border2);border-radius:8px;color:var(--bright);padding:9px 12px;font-family:var(--mono);font-size:13px;width:200px;max-width:100%}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:104px}
.stat b{display:block;font-family:var(--mono);font-size:20px;color:var(--bright)}
.stat span{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.radar{display:flex;flex-direction:column;align-items:center;justify-content:center}
.radar svg{width:100%;max-width:300px;height:auto;overflow:visible}
.radar text{font-family:var(--mono);font-size:9px;fill:var(--dim)}
.radar .cap{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-top:4px}

/* Campaign */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.day{padding:18px;position:relative;transition:transform .2s,border-color .2s}
.day:hover{transform:translateY(-3px);border-color:var(--border2)}
.day-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.ring{position:relative;width:62px;height:62px;flex-shrink:0}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .t{stroke:var(--border)}
.ring .p{stroke:var(--c,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 5px var(--c,var(--accent)))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:17px;color:var(--bright)}
.day-code{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--c,var(--accent))}
.day-title{font-weight:800;color:var(--bright);font-size:17px;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.dchip{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:6px;border:1px solid;color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.mission{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-top:8px;transition:border-color .15s,background .15s,transform .15s}
.mission:hover{border-color:var(--accent);background:rgba(159,239,0,.07);transform:translateX(3px)}
.mission .ic{font-size:18px;width:24px;text-align:center}
.mission .mt{font-weight:700;color:var(--bright);font-size:14px}
.mission .md{font-size:12px;color:var(--dim);line-height:1.35}
.mission .best{margin-left:auto;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--border2);color:var(--dim);white-space:nowrap}
.mission .best.pass{color:var(--ok);border-color:rgba(0,200,83,.5)}
.mission .best.try{color:var(--warn);border-color:rgba(255,171,0,.4)}
.mission.exam{border-color:rgba(255,215,0,.45);background:linear-gradient(90deg,rgba(255,215,0,.08),transparent)}

.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.badge{padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface);opacity:.45}
.badge.got{opacity:1;border-color:rgba(255,215,0,.5);box-shadow:0 0 18px rgba(255,215,0,.08) inset}
.badge b{display:block;color:var(--bright);font-size:13px}
.badge span{font-size:11.5px;color:var(--dim);line-height:1.35;display:block;margin-top:2px}
.badge .bi{font-size:20px;margin-bottom:4px;display:block}

.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tool{padding:15px}
.tool b{color:var(--bright);font-size:15px}
.tool a{color:var(--accent)}
.tool .tt{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:5px;margin:6px 0 8px;border:1px solid var(--border2);color:var(--dim)}
.tool.research .tt{color:var(--warn);border-color:rgba(255,171,0,.45)}
.tool.defend .tt{color:var(--ok);border-color:rgba(0,200,83,.45)}
.tool p{font-size:13px;line-height:1.5}
.tool{display:flex;flex-direction:column}
.tool .tt{align-self:flex-start}
.tool h3{font-size:16px;margin:0}
.tool h3 a{color:var(--bright);text-decoration:none;border-bottom:1px dashed rgba(159,239,0,.5)}
.tool h3 a:hover{color:var(--accent)}
.tool h3 a::after{content:' ↗';font-size:12px;color:var(--accent)}
.tool.offense .tt{color:var(--accent2);border-color:rgba(255,107,53,.45)}
.tool.crypto .tt{color:var(--accent5);border-color:rgba(199,125,255,.45)}
.tool.forensics .tt{color:#7fb7ff;border-color:rgba(127,183,255,.45)}
.tool.practice .tt{color:var(--accent4);border-color:rgba(255,215,0,.45)}
.tool .try{margin-top:10px;font-family:var(--mono);font-size:11.5px;background:#05080e;border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:#c9d4e8;word-break:break-word}
.tool .try b{display:block;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.tool .tobj{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--dim)}
.kcat{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kcat h3{font-size:15px;color:var(--bright);margin:0}
.kcat span{font-size:12.5px;color:var(--dim)}
.note{font-size:12px;color:var(--dim);margin-top:10px}

/* Mission runner */
.run-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.run-title{font-weight:800;color:var(--bright);font-size:16px}
.combo{font-family:var(--mono);font-size:11px;color:var(--accent2);padding:5px 10px;border:1px solid rgba(255,107,53,.5);border-radius:20px;animation:pop .3s}
.timer{font-family:var(--mono);font-size:13px;color:var(--accent4);padding:5px 10px;border:1px solid rgba(255,215,0,.45);border-radius:20px}
.timer.low{color:var(--bad);border-color:var(--bad);animation:blink 1s infinite}
.ghost{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--text)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.qcard{overflow:hidden}
.qcard.enter{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.qhdr{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qnum{font-family:var(--mono);font-size:10px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent);padding:4px 10px;border-radius:6px;white-space:nowrap;margin-top:2px}
.qname{font-size:17px;font-weight:800;color:var(--bright);line-height:1.3}
.qdom{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.qbody{padding:20px}
.stem{font-size:17px;color:var(--bright);line-height:1.55;margin-bottom:18px;font-weight:500}
.scenario{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:8px;padding:13px 16px;margin-bottom:16px;font-size:14.5px;line-height:1.7;overflow-x:auto}
.scenario strong,.stem strong{color:var(--bright)}
.scenario ul{padding-left:18px;margin-top:6px}
.scenario table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:12px;min-width:480px}
.scenario th{color:var(--accent);text-align:left;padding:7px 9px;border-bottom:2px solid var(--border2);font-size:10px;letter-spacing:1px}
.scenario td{padding:6px 9px;border-bottom:1px solid var(--border)}
td.ok{color:var(--ok);font-weight:700}td.bad{color:var(--bad);font-weight:700}
.tip{background:rgba(255,171,0,.06);border:1px solid rgba(255,171,0,.25);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;line-height:1.6;color:var(--warn);font-family:var(--mono)}
.qlabel{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin:4px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.terminal{background:#040508;border:1px solid var(--border);border-radius:8px;padding:13px 15px;font-family:var(--mono);font-size:11.5px;line-height:1.8;margin-bottom:18px;overflow-x:auto;white-space:pre}
.terminal .p{color:#7cfc00}.terminal .d{color:var(--dim)}.terminal .h{color:var(--accent4);font-weight:600}.terminal .e{color:var(--bad)}.terminal .v{color:var(--accent5)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:18px}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.cl{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.cv{font-size:15px;font-weight:700;color:var(--bright);font-family:var(--mono)}

.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:13px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:15px;line-height:1.5;margin-bottom:8px;text-align:left;transition:border-color .12s,background .12s,transform .12s}
.opt:not(:disabled):hover{border-color:var(--border2);transform:translateX(3px)}
.opt.sel{border-color:var(--accent);background:rgba(159,239,0,.08);color:var(--bright)}
.opt.ok{border-color:var(--ok);background:rgba(0,200,83,.1);color:var(--bright)}
.opt.bad{border-color:var(--bad);background:rgba(255,61,87,.1)}
.opt:disabled{cursor:default}
.ol{font-family:var(--mono);font-size:11px;color:var(--accent);background:rgba(159,239,0,.1);padding:3px 8px;border-radius:5px;font-weight:700;flex-shrink:0}
.mcq{margin-bottom:20px}
.mcp{font-size:15px;color:var(--bright);margin-bottom:10px;font-weight:700;line-height:1.5}

.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.row.ok{border-color:var(--ok)}.row.bad{border-color:var(--bad)}
.rdesc{flex:1 1 260px;font-size:14px;line-height:1.6}
.rdesc strong{color:var(--bright)}
.rsel{display:flex;flex-direction:column;gap:6px;flex:0 1 240px;min-width:190px}
select{background:var(--solid);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:9px 10px;font-family:var(--mono);font-size:12px;width:100%}
.rans{flex-basis:100%;font-family:var(--mono);font-size:11.5px;color:#ff9aaa}

.pool,.zone{border:1px dashed var(--border2);border-radius:10px;padding:12px;background:var(--surface2);min-height:64px}
.pool{margin-bottom:12px}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.zone.target,.pool.target{border-color:var(--accent);cursor:pointer;background:rgba(159,239,0,.04)}
.zlabel{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:9px;color:var(--dim)}
.zone:nth-child(4n+1) .zlabel{color:var(--accent5)}.zone:nth-child(4n+2) .zlabel{color:var(--accent)}.zone:nth-child(4n+3) .zlabel{color:var(--accent3)}.zone:nth-child(4n) .zlabel{color:var(--accent2)}
.chipset{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--solid);border:1px solid var(--border2);border-radius:6px;padding:9px 12px;font-size:13.5px;user-select:none;color:var(--text);text-align:left}
.chip:not(:disabled):hover{border-color:var(--accent)}
.chip.sel{border-color:var(--accent);background:rgba(159,239,0,.12);color:var(--bright);box-shadow:0 0 12px rgba(159,239,0,.25)}
.chip.ok{border-color:var(--ok);background:rgba(0,200,83,.08)}
.chip.bad{border-color:var(--bad);background:rgba(255,61,87,.08)}
.chip small{display:block;font-family:var(--mono);font-size:10px;color:#ff9aaa;margin-top:3px}
.empty{font-size:12px;color:var(--dim)}

.seq{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.slot{display:flex;align-items:center;gap:10px;border:1px dashed var(--border2);border-radius:8px;padding:10px 13px;min-height:46px;font-size:13.5px;color:var(--dim);background:transparent;text-align:left;width:100%}
.slot.filled{border-style:solid;background:var(--surface2);color:var(--text)}
.slot.ok{border-color:var(--ok)}.slot.bad{border-color:var(--bad)}
.sn{font-family:var(--mono);font-size:11px;color:var(--accent5);background:rgba(199,125,255,.12);padding:2px 8px;border-radius:4px;flex-shrink:0}

.mgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px}
.mcol{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.mi{display:block;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:7px;line-height:1.5;color:var(--text);text-align:left}
.mi.sel{border-color:var(--accent);background:rgba(159,239,0,.1)}
.mi.paired{border-color:var(--accent5)}
.mi.ok{border-color:var(--ok);background:rgba(0,200,83,.07)}
.mi.bad{border-color:var(--bad);background:rgba(255,61,87,.07)}
.mb{font-family:var(--mono);font-size:10px;color:var(--accent5);background:rgba(199,125,255,.14);padding:1px 7px;border-radius:4px;margin-right:7px}

.btn-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 24px;border-radius:10px;font-size:14px;font-weight:800;border:1px solid transparent;background:var(--accent);color:#0b121f;transition:transform .12s,box-shadow .12s}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(159,239,0,.35)}
.btn:disabled{opacity:.35;cursor:default}
.btn.gold{background:var(--accent4)}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--dim)}

.feedback{border-radius:10px;padding:14px 16px;margin-top:18px;font-size:14px;line-height:1.7;animation:rise .3s}
.feedback.pass{background:rgba(0,200,83,.07);border:1px solid rgba(0,200,83,.3);color:#a5ffd6}
.feedback.partial{background:rgba(255,171,0,.07);border:1px solid rgba(255,171,0,.3);color:#ffe7a3}
.feedback.fail{background:rgba(255,61,87,.07);border:1px solid rgba(255,61,87,.3);color:#ffc2cb}
.fbt{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fbt .xp{font-family:var(--mono);font-size:11px;color:var(--accent4);border:1px solid rgba(255,215,0,.4);border-radius:20px;padding:2px 9px}
.feedback ul{padding-left:18px;margin-top:6px}.feedback li{margin-bottom:5px}
.obj{font-family:var(--mono);font-size:10.5px;margin-top:10px;opacity:.75;border-top:1px solid rgba(255,255,255,.08);padding-top:8px}

/* Debrief */
.debrief{padding:30px 22px;text-align:center;margin-top:10px}
.big{position:relative;width:190px;height:190px;margin:10px auto 16px}
.big svg{width:190px;height:190px;transform:rotate(-90deg)}
.big circle{fill:none;stroke-width:9}
.big .t{stroke:var(--border)}
.big .p{stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px currentColor)}
.big div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big b{font-size:46px;font-weight:800;color:var(--bright);font-family:var(--mono);line-height:1}
.big span{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px}
.verdict{font-size:24px;font-weight:800;color:var(--bright)}
.sub{color:var(--dim);font-size:14px;margin:4px 0 16px}
.gains{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.levelup{display:inline-block;margin-bottom:16px;padding:8px 18px;border-radius:30px;border:1px solid var(--accent4);color:var(--accent4);font-weight:800;animation:pop .5s,glow 1.6s infinite alternate}
.dbars{max-width:620px;margin:0 auto 22px;text-align:left}
.dbar{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:12.5px}
.dbar .bar{grid-column:1/3;height:7px}
.dbar .bar i{background:var(--c)}
.dbar b{font-family:var(--mono);text-align:right;color:var(--bright)}
.rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;text-align:left;margin:0 auto 22px;max-width:920px}
.revc{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--bad);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.4;text-align:left}
.revc.pass{border-left-color:var(--ok)}
.revc:hover{border-color:var(--accent)}
.revc small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-bottom:2px}

.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.foot a{color:var(--accent)}
.foot button{background:none;border:0;color:var(--dim);text-decoration:underline;font-size:12px}
.foot .stack{font-family:var(--mono);font-size:10.5px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:10;background:var(--solid);border:1px solid var(--accent4);color:var(--accent4);font-family:var(--mono);font-size:13px;font-weight:700;padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.45}}
@keyframes glow{from{box-shadow:0 0 6px rgba(255,215,0,.2)}to{box-shadow:0 0 22px rgba(255,215,0,.55)}}
@media(max-width:760px){
  .hud{position:static}
  .hero{grid-template-columns:1fr;padding:20px}
  .mgrid{grid-template-columns:1fr}
  .qbody{padding:15px}.qhdr{padding:13px 15px}
  .rsel{flex-basis:100%}
  .xpbox{flex:1 1 100%;order:5}
  .stem{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ───────── CTF layer ───────── */
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.brand,.box-name,.verdict,h1{font-family:var(--mono);letter-spacing:-.5px}
h1{font-weight:700}
.snd{padding:6px 10px;font-size:14px}
.callsign label{color:var(--accent);font-size:13px;letter-spacing:0;text-transform:none}
.callsign input{border-color:rgba(159,239,0,.35);color:var(--accent)}
.own{margin-top:18px;max-width:520px}
.big-bar{height:10px}
.big-bar i{box-shadow:0 0 12px rgba(159,239,0,.6)}
.hero p b{color:var(--bright)}
.diff{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.5px}
.diff.easy{color:#9fef00}.diff.medium{color:#ffab00}.diff.hard{color:#ff6b35}.diff.insane{color:#ff3d57}

.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.box{padding:18px;transition:transform .2s,border-color .2s,box-shadow .2s;border-top:2px solid var(--c)}
.box:hover{transform:translateY(-3px);box-shadow:0 10px 34px rgba(0,0,0,.45)}
.box.pwned{box-shadow:0 0 0 1px rgba(159,239,0,.35),0 0 26px rgba(159,239,0,.1) inset}
.box-top{display:flex;gap:13px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:25px;color:var(--c);border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--c) 35%,transparent);flex-shrink:0}
.box-id{flex:1;min-width:0}
.box-name{font-weight:700;color:var(--bright);font-size:18px}
.box-meta{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px}
.owns{display:flex;flex-direction:column;gap:4px}
.ownp{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);color:var(--dim);text-align:center}
.ownp.on{color:#0b121f;background:var(--accent);border-color:var(--accent);font-weight:700}
.box-blurb{font-size:13px;margin:12px 0 10px;line-height:1.5}
.attack{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-top:8px;transition:border-color .15s,background .15s,transform .15s}
.attack:not(:disabled):hover{border-color:var(--accent);background:rgba(159,239,0,.07);transform:translateX(3px)}
.attack:disabled{opacity:.45;cursor:not-allowed}
.attack .ak{width:22px;text-align:center;color:var(--accent);font-size:15px}
.attack .mt{font-weight:700;color:var(--bright);font-size:14px}
.attack .md{font-size:12px;color:var(--dim);line-height:1.35}
.attack .pts{margin-left:auto;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--border2);color:var(--accent4);white-space:nowrap}
.attack.have .pts{color:var(--accent);border-color:rgba(159,239,0,.5)}
.attack.boss{border-color:rgba(255,61,87,.5);background:linear-gradient(90deg,rgba(255,61,87,.1),transparent)}
.attack.boss .ak{color:var(--bad)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--text)}
.fchip:hover{border-color:var(--c,var(--accent))}
.fchip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#0b121f;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chal{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--c);min-height:132px;transition:transform .15s,border-color .15s,box-shadow .15s}
.chal:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 8px 26px rgba(0,0,0,.4)}
.chal.solved{background:linear-gradient(160deg,rgba(159,239,0,.09),var(--surface) 60%)}
.ctop{display:flex;justify-content:space-between;align-items:center}
.ctype{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--dim)}
.cname{font-weight:700;color:var(--bright);font-size:14.5px;line-height:1.3}
.ccat{font-family:var(--mono);font-size:10px;color:var(--c)}
.cbot{margin-top:auto;font-family:var(--mono);font-size:11px}
.cpts{color:var(--accent4)}
.cflag{color:var(--accent);word-break:break-all;font-size:10px}

.run-title small{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:400;letter-spacing:1px;margin-right:4px}
.lives{display:inline-flex;gap:4px;padding:6px 10px;border:1px solid var(--border2);border-radius:20px;background:var(--surface)}
.lives i{width:9px;height:14px;border-radius:2px;background:var(--border2)}
.lives i.on{background:var(--accent);box-shadow:0 0 8px rgba(159,239,0,.7)}
.lives.hit{animation:shake .4s;border-color:var(--bad)}
.qcard.shake{animation:shake .4s}
.btn.danger{background:var(--bad);color:#fff}

.tasks{display:grid;gap:7px;margin-bottom:14px}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.5}
.task.ok{border-color:rgba(159,239,0,.55);color:var(--bright)}
.task.bad{border-color:rgba(255,61,87,.45)}
.tn{font-family:var(--mono);font-size:11px;min-width:22px;height:22px;display:grid;place-items:center;border-radius:5px;background:rgba(199,125,255,.14);color:var(--accent5);flex-shrink:0}
.task.ok .tn{background:var(--accent);color:#0b121f;font-weight:700}
.term{border:1px solid var(--border2);border-radius:10px;overflow:hidden;background:#05080e;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.term-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#111927;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.term-bar i:nth-child(2){background:#febc2e}.term-bar i:nth-child(3){background:#28c840}
.term-bar span{margin-left:8px}
.term-out{font-family:var(--mono);font-size:12.5px;line-height:1.55;padding:12px 14px 4px;height:360px;overflow:auto;white-space:pre;color:#c9d4e8}
.term-out .ti{color:var(--bright);font-weight:600}.term-out .te{color:#ff8fa0}.term-out .tk{color:var(--accent);font-weight:700}.term-out .ts{color:#7fb7ff}
.term-in{display:flex;align-items:center;gap:8px;padding:6px 14px 12px;font-family:var(--mono);font-size:12.5px}
.term-in label{color:var(--accent);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--bright);font:inherit;caret-color:var(--accent)}

.debrief.won{border-color:rgba(159,239,0,.45);box-shadow:0 0 60px rgba(159,239,0,.08) inset}
.verdict{font-size:30px;font-weight:700;letter-spacing:2px;position:relative;display:inline-block}
.verdict.good{color:var(--accent);text-shadow:0 0 18px rgba(159,239,0,.5)}
.verdict.badv{color:var(--bad);text-shadow:0 0 18px rgba(255,61,87,.4)}
.verdict::before,.verdict::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;opacity:.55;pointer-events:none}
.verdict::before{color:#2ee7b6;animation:glitch 2.6s infinite steps(1)}
.verdict::after{color:#ff3d57;animation:glitch 2.6s infinite steps(1) reverse}
.flagbox{display:inline-flex;align-items:center;gap:10px;margin:4px 0 18px;padding:10px 14px;border:1px dashed var(--accent);border-radius:10px;background:rgba(159,239,0,.06);max-width:100%}
.flagbox code{font-size:14px;color:var(--accent);background:none;min-height:1.2em}
.flagbox .fl{color:var(--accent);font-size:18px}
.flagbox .ghost{padding:4px 10px;font-size:11px}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes glitch{0%,91%,100%{transform:none;clip-path:inset(0 0 100% 0)}92%{transform:translate(-3px,1px);clip-path:inset(10% 0 55% 0)}95%{transform:translate(3px,-1px);clip-path:inset(60% 0 8% 0)}98%{transform:translate(-2px,0);clip-path:inset(35% 0 35% 0)}}
@media(max-width:760px){.term-out{height:300px;font-size:11.5px}.verdict{font-size:22px}}

/* ───────── polish ───────── */
html{scroll-behavior:smooth;scroll-padding-top:84px}
.hud{border-bottom:1px solid transparent;margin:0 -16px;padding:12px 16px;background:rgba(11,18,31,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-color:var(--border)}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{background:none;border:0;padding:7px 11px;border-radius:8px;font-size:13px;font-weight:700;color:var(--dim)}
.nav button:hover{color:var(--bright);background:rgba(255,255,255,.05)}
.hero{margin-top:22px;padding:36px}
.hero p{font-size:15.5px;line-height:1.65}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
.btn.lead{padding:14px 26px;font-size:15px;box-shadow:0 0 0 0 rgba(159,239,0,.5);animation:beacon 2.4s infinite}
.own{margin-top:22px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.step>b{font-family:var(--mono);font-size:13px;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:rgba(159,239,0,.12);color:var(--accent);flex-shrink:0}
.step strong{display:block;color:var(--bright);font-size:14.5px}
.step span{font-size:12.5px;color:var(--dim);line-height:1.45;display:block;margin-top:2px}
h2{margin:46px 0 16px;font-size:22px;padding-left:12px;border-left:3px solid var(--accent)}
.box{padding:20px;display:flex;flex-direction:column}
.box .chips{margin-bottom:6px}
.box .attack:first-of-type{margin-top:auto}
@media(min-width:1000px){.boxes{grid-template-columns:repeat(3,1fr)}.box.wide{grid-column:span 2}.box.wide .box-blurb{max-width:60ch}}
.attack{padding:13px 14px}
.chal{padding:16px;min-height:140px}
.badge{padding:15px}
.tool{padding:18px}
.foot{line-height:1.6}
@keyframes beacon{0%{box-shadow:0 0 0 0 rgba(159,239,0,.45)}70%{box-shadow:0 0 0 14px rgba(159,239,0,0)}100%{box-shadow:0 0 0 0 rgba(159,239,0,0)}}
@media(max-width:900px){.nav{display:none}}
@media(max-width:760px){.hud{position:static}.hero{padding:22px}}

/* ───────── console, labs, evidence map ───────── */
.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.console .term-out{height:268px;font-size:11.5px}
.console .term-in input::placeholder{color:#4d5b75}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick .fchip{font-size:10.5px;padding:4px 10px}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lab{display:flex;flex-direction:column;gap:6px;text-align:left;padding:0 0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.lab>span:not(.lab-scr){padding:0 14px}
.lab:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.lab.solved{border-color:rgba(159,239,0,.45)}
.lab-scr{display:block;background:#05080e;border-bottom:1px solid var(--border);padding:14px;font-family:var(--mono);font-size:11px;line-height:1.5;min-height:66px;margin-bottom:6px;color:#c9d4e8;word-break:break-all}
.lab-scr .lp{color:var(--accent)}
.cursor{color:var(--accent);animation:blink 1.1s steps(1) infinite;margin-left:2px}
.lab .cbot{padding-top:4px}
.mast{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px;align-items:center;padding:22px}
.mast .dbars,.mbars{max-width:none;margin:0}
.labtop{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:start}
.labtop .tasks{margin:0}
.emap{border:1px solid var(--border);border-radius:10px;background:radial-gradient(circle at 50% 40%,rgba(159,239,0,.05),transparent 70%),#080d17;padding:10px 10px 4px}
.emap svg{width:100%;height:auto;display:block}
.emap line{stroke:#2a3850;stroke-width:1.5;stroke-dasharray:4 5}
.emap line.on{stroke:var(--accent);stroke-dasharray:6 6;animation:flow 1s linear infinite;filter:drop-shadow(0 0 3px rgba(159,239,0,.7))}
.emap .ll{font-family:var(--mono);font-size:9px;fill:#56657f}.emap .ll.on{fill:var(--accent)}
.emap circle{fill:#111927;stroke:#34445e;stroke-width:1.5}
.emap .nd.on circle{stroke:var(--accent);fill:rgba(159,239,0,.1);filter:drop-shadow(0 0 6px rgba(159,239,0,.55))}
.emap .nd.ask:not(.on) circle{stroke:#ffab00;stroke-dasharray:3 3}
.emap .ni{font-size:17px;fill:#ffab00;font-family:var(--mono)}
.emap .nd.on .ni{fill:var(--bright)}
.emap .nl{font-size:10px;fill:var(--text);font-family:var(--sans);font-weight:700}
.emap .nv{font-size:9px;fill:var(--dim);font-family:var(--mono)}
.emap .nd.on.ask .nv{fill:var(--accent);font-weight:700}
.tb{display:grid;grid-template-columns:minmax(90px,200px) 1fr 44px;gap:10px;align-items:center;margin:2px 0}
.tbl{overflow:hidden;text-overflow:ellipsis;color:var(--bright)}
.tbb{height:11px;background:#111927;border-radius:3px;overflow:hidden}
.tbb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#2ee7b6);border-radius:3px;animation:grow .5s cubic-bezier(.2,.8,.2,1)}
.tbn{text-align:right;color:var(--accent4)}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes grow{from{width:0}}
@media(max-width:900px){.hero,.labtop,.mast{grid-template-columns:minmax(0,1fr)}}
.xpbox{min-width:140px;flex:0 1 190px}
.nav button{padding:7px 8px}
.hud{gap:10px}

.term-in .run{background:rgba(159,239,0,.12);border:1px solid rgba(159,239,0,.4);color:var(--accent);border-radius:6px;padding:3px 10px;font-family:var(--mono);font-size:13px}
.term-in .run:hover{background:var(--accent);color:#0b121f}

/* ───────── per-task answer boxes ───────── */
.task{flex-wrap:wrap}
.task>span:nth-child(2){flex:1 1 200px}
.tform{display:flex;gap:6px;flex-basis:100%;margin-left:32px}
.tform input{flex:1;min-width:0;background:var(--solid);border:1px solid var(--border2);border-radius:6px;color:var(--bright);padding:7px 10px;font-family:var(--mono);font-size:12.5px}
.tform input:focus{border-color:var(--accent);outline:0}
.tform button{background:var(--accent);color:#0b121f;border:0;border-radius:6px;padding:7px 14px;font-weight:800;font-size:12.5px}
.tform button:hover{box-shadow:0 0 12px rgba(159,239,0,.45)}
.tans{flex-basis:100%;margin-left:32px;font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.tmsg{flex-basis:100%;margin-left:32px;font-family:var(--mono);font-size:11px;color:#ff8fa0}
@media(max-width:760px){.tform,.tans,.tmsg{margin-left:0}}

/* ───────── flag submission ───────── */
.subp{padding:22px}
.subp>p{font-size:14px;max-width:70ch;margin-bottom:14px}
.subgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.fld input,.fld textarea{background:var(--solid);border:1px solid var(--border2);border-radius:8px;color:var(--bright);padding:10px 12px;font-family:var(--mono);font-size:13px;width:100%;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);outline:0}
#subst{font-size:12px}
#subst.err{color:var(--bad)}
.sublist{display:grid;gap:6px}
.subrow{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:12.5px}
.subrow.ok{border-left-color:var(--ok)}.subrow.bad{border-left-color:var(--bad)}
.subrow code{color:var(--accent);background:none;padding:0}
.subrow span{color:var(--dim);font-family:var(--mono);font-size:11px}
@media(max-width:760px){.subgrid{grid-template-columns:1fr}}
.grade{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 26px;align-items:center;margin:4px 0 20px;padding:18px;border:1px solid var(--border2);border-radius:12px;background:var(--surface2)}
.gscore{text-align:center;min-width:120px}
.gscore b{display:block;font-family:var(--mono);font-size:40px;line-height:1;color:var(--bright)}
.gscore b small{font-size:18px;color:var(--dim)}
.gscore span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:6px}
.gscore .bar{margin-top:10px}
.glabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;font-size:13px}
.glab{display:flex;gap:8px;align-items:baseline}
.glab em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto;white-space:nowrap}
.glab.queue em{color:var(--accent4)}
.glab.ok em{color:var(--ok)}.glab.cap em{color:var(--warn)}.glab.wait em{color:#7fb7ff}
.gnote{grid-column:1/-1;font-size:12px;color:var(--dim);border-top:1px solid var(--border);padding-top:10px}
@media(max-width:560px){.grade{grid-template-columns:1fr}}
/* ───────── reference: ports & acronyms ───────── */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.refp{padding:20px}
.reftabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.reftabs [role=tab]{font-family:var(--mono);font-size:12px;padding:8px 14px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text)}
.reftabs [role=tab][aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#0b121f;font-weight:700}
.reftools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.reftools input{flex:1 1 240px;min-width:0;background:var(--solid);border:1px solid var(--border2);border-radius:8px;color:var(--bright);padding:10px 12px;font-family:var(--mono);font-size:13px}
.reftools input:focus{border-color:var(--accent);outline:0}
.refcount{font-family:var(--mono);font-size:11px;color:var(--dim)}
.refscroll{max-height:540px;overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface2)}
.ptable{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.ptable th{position:sticky;top:0;background:var(--solid);text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);padding:9px 10px;border-bottom:2px solid var(--border2)}
.ptable td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
.ptable td:first-child{font-family:var(--mono);font-weight:700;color:var(--accent4);white-space:nowrap}
.ptable td:nth-child(2){font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
.ptable td:nth-child(3){color:var(--bright);font-weight:700}
.ptable .sec{color:#a5ffd6;font-size:12px}
.ptable tr:hover td{background:rgba(159,239,0,.04)}
.ctag{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;padding:1px 6px;border-radius:4px;color:var(--bad);border:1px solid rgba(255,61,87,.45);vertical-align:middle;font-weight:400}
.alist{margin:0;padding:4px 0}
.arow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 14px;padding:8px 14px;border-bottom:1px solid var(--border)}
.arow dt{font-family:var(--mono);font-weight:700;color:var(--accent4);word-break:break-word}
.arow dd{margin:0;color:var(--bright);font-size:13.5px}
.arow dd small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.refempty{padding:18px;color:var(--dim);font-size:13px}
.flash{margin-bottom:14px;padding:18px;border:1px dashed var(--accent);border-radius:12px;background:rgba(159,239,0,.05);text-align:center}
.flash .fq{font-size:13px;color:var(--dim);font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}
.flash .fbig{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--bright);margin:6px 0}
.flash .fa{color:#a5ffd6;font-size:15px;min-height:1.5em;margin-bottom:10px}
.flash .fa small{display:block;color:var(--dim);font-size:12.5px;margin-top:4px}
.flash .btn-row{justify-content:center;margin-top:8px}
@media(max-width:560px){.arow{grid-template-columns:1fr}.flash .fbig{font-size:24px}}
